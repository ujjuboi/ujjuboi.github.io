name: Update README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze repo and regenerate README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            function walkDir(dir, prefix) {
              prefix = prefix || '';
              var entries = fs.readdirSync(dir, { withFileTypes: true })
                .filter(function(e) {
                  return e.name !== '.git' && e.name !== 'node_modules' && e.name !== '.github' && e.name !== 'plan';
                })
                .sort(function(a, b) {
                  if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
                  return a.name.localeCompare(b.name);
                });

              var lines = [];
              for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                var isLast = i === entries.length - 1;
                var connector = isLast ? '\u2514\u2500\u2500 ' : '\u251C\u2500\u2500 ';
                var childPrefix = isLast ? '    ' : '\u2502   ';

                if (entry.isDirectory()) {
                  var dirPath = path.join(dir, entry.name);
                  var children = walkDir(dirPath, prefix + childPrefix);
                  lines.push(prefix + connector + entry.name + '/');
                  lines = lines.concat(children);
                } else {
                  lines.push(prefix + connector + entry.name);
                }
              }
              return lines;
            }

            function getLatestPost() {
              var manifestPath = 'src/Blogs/posts.json';
              if (!fs.existsSync(manifestPath)) return null;
              try {
                var filenames = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                if (filenames.length === 0) return null;
                var mdPath = 'src/Blogs/' + filenames[0];
                if (!fs.existsSync(mdPath)) return null;
                var lines = fs.readFileSync(mdPath, 'utf8').split('\n');
                var meta = {};
                for (var li = 0; li < lines.length; li++) {
                  if (lines[li].startsWith('## Paragraphs')) break;
                  var m = lines[li].match(/^## (\w+):\s*(.+)/);
                  if (m) meta[m[1].toLowerCase()] = m[2].trim();
                }
                if (meta.title) return { title: meta.title, category: meta.category || '' };
              } catch (e) {}
              return null;
            }

            function getLeetcodeApi() {
              var projectsPath = 'pages/Projects/Projects.html';
              if (!fs.existsSync(projectsPath)) return null;
              var content = fs.readFileSync(projectsPath, 'utf8');
              var match = content.match(/https:\/\/leetcode-stats\.tashif\.codes\/[\w]+/);
              return match ? match[0] : null;
            }

            function getGitHubUser() {
              var projectsPath = 'pages/Projects/Projects.html';
              if (!fs.existsSync(projectsPath)) return null;
              var content = fs.readFileSync(projectsPath, 'utf8');
              var match = content.match(/api\.github\.com\/users\/[\w-]+/);
              return match ? match[0].split('/').pop() : null;
            }

            function detectNoticeRoutes() {
              var files = ['index.html', 'pages/Resume/Resume.html', 'pages/Blog/Blog.html'];
              var routes = [];
              for (var fi = 0; fi < files.length; fi++) {
                var file = files[fi];
                if (!fs.existsSync(file)) continue;
                var content = fs.readFileSync(file, 'utf8');
                var matches = content.match(/notice\(\)/g);
                if (matches && matches.length > 0) {
                  var navLinks = content.match(/<a[^>]*href="([^"]*)"[^>]*>[^<]*<\/a>/g) || [];
                  for (var ni = 0; ni < navLinks.length; ni++) {
                    var hrefMatch = navLinks[ni].match(/href="([^"]*)"/);
                    if (hrefMatch) {
                      var href = hrefMatch[1];
                      if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
                        var targetFile = href.startsWith('.') ? href.slice(2) : href;
                        if (!fs.existsSync(targetFile)) {
                          routes.push(href);
                        }
                      }
                    }
                  }
                }
              }
              return routes.filter(function(v, i, a) { return a.indexOf(v) === i; });
            }

            function detectPageDetails(filePath) {
              if (!fs.existsSync(filePath)) return null;
              var content = fs.readFileSync(filePath, 'utf8');

              var loads = ['`style.css`'];
              var cssFile = filePath.replace('.html', '.css');
              if (fs.existsSync(cssFile)) {
                loads.push('`' + path.basename(cssFile) + '`');
              }

              var scripts = [];
              if (content.includes('salutation') || content.includes('greeting')) {
                scripts.push('Time-based greeting into `#salutation`');
              }
              if (content.includes('notice()')) {
                scripts.push('`notice()` alerts for unbuilt nav links');
              }
              if (content.includes('toggleSection')) {
                scripts.push('`toggleSection()` collapsible sections (+/- icons)');
              }
              if (content.includes('renderBlogList') || content.includes('showPost')) {
                scripts.push('Posts from `posts.json` manifest; `renderBlogList()` grouped by category; `showPost()`/`showBlogList()` view-swap');
              }
              if (content.includes('leetcode') || content.includes('LeetCode')) {
                scripts.push('LeetCode stats via third-party API');
              }
              if (content.includes('api.github.com')) {
                scripts.push('GitHub API integration for repos/stats');
              }
              if (content.includes('theme-select') || content.includes('themeSelect')) {
                scripts.push('theme-select + menu-icon logic');
              }
              if (content.includes('menu-icon') || content.includes('menuIcon')) {
                if (scripts.every(function(s) { return !s.includes('menu-icon'); })) {
                  scripts.push('menu-icon logic');
                }
              }

              return { loads: loads.join(' + '), scripts: scripts.join('; ') || 'N/A' };
            }

            var fileTreeLines = walkDir('.', '');
            var fileTree = fileTreeLines.join('\n');

            var pageList = ['index.html'];
            var dirs = fs.readdirSync('pages', { withFileTypes: true })
              .filter(function(d) { return d.isDirectory(); })
              .map(function(d) { return d.name; });

            for (var di = 0; di < dirs.length; di++) {
              var htmlPath = 'pages/' + dirs[di] + '/' + dirs[di] + '.html';
              if (fs.existsSync(htmlPath)) {
                pageList.push(htmlPath);
              }
            }

            var pageRows = '';
            for (var pi = 0; pi < pageList.length; pi++) {
              var details = detectPageDetails(pageList[pi]);
              if (details) {
                pageRows += '| `' + pageList[pi] + '` | ' + details.loads + ' | ' + details.scripts + ' |\n';
              }
            }

            var noticeRoutes = detectNoticeRoutes();
            var leetcodeApi = getLeetcodeApi();
            var githubUser = getGitHubUser();
            var latestPost = getLatestPost();

            var lines = [];
            lines.push('# BlowGrrr');
            lines.push('Making my own dynamic blogging website!');
            lines.push('<a href="https://ujjuboi.github.io/">Check It Out!</a>');
            lines.push('');
            lines.push('## Main Objectives:');
            lines.push('* Learn Model View Control Framework');
            lines.push('* HTML Semantics');
            lines.push('* CSS & SASS media queries');
            lines.push('* JavaScript & Responsiveness');
            lines.push('');
            lines.push('---');
            lines.push('');
            lines.push('# Project Map (for AI agents)');
            lines.push('');
            lines.push('> Reference this section instead of re-scanning the repo. Static portfolio site: plain HTML/CSS + inline vanilla JS. **No build system, no package manager, no dependencies** \u2014 files are served as-is via GitHub Pages. To preview locally, just open `index.html` in a browser.');
            lines.push('');
            lines.push('## File tree');
            lines.push('');
            lines.push('```');
            lines.push(fileTree);
            lines.push('```');
            lines.push('');
            lines.push('## Page inventory');
            lines.push('');
            lines.push('| Page | Loads | Inline `<script>` does |');
            lines.push('|---|---|---|');
            lines.push(pageRows);
            lines.push('## Key details / conventions');
            lines.push('');
            lines.push('- **Shared header/footer**: The `<header>` (brand + nav) and footer social-SVG block are **duplicated verbatim across pages** \u2014 any nav or footer change must be applied to every page. `.active` class marks the current page\'s nav link.');
            lines.push('- **Theming**: All colors and fonts come from CSS custom properties in `:root` of `style.css` (`--borderColor`, `--backgroundColor`, `--shadowColor`, `--contentColor`, `--headings`, `--poppins`, etc.). Never hardcode colors \u2014 use the variables. Fonts are imported at the top of `style.css`.');
            lines.push('- **Layout**: `body` is a CSS grid (`15vh / 60vh / 28vh`) with `overflow: hidden` on desktop pages. Pages that need scrolling must override this (e.g., `Blog.css` sets `body { display:block; overflow-y:auto }`). Uses `720px` breakpoint for responsive work.');
            lines.push('- **Visual language**: Beige background, black borders, offset solid box-shadows (`--shadowColor`), rounded corners. Reuse existing patterns (`.skill-item` styling) rather than inventing new ones.');
            lines.push('- **Assets**: `Images/` holds shared assets: `MyImage.jpg` (hero photo) plus social/menu/signature SVGs. Footer social icons are inline SVGs in the HTML, not `<img>` tags.');

            if (noticeRoutes.length > 0) {
              lines.push('- **Unbuilt routes**: ' + noticeRoutes.map(function(r) { return '`' + r + '`'; }).join(', ') + ' currently call `notice()` ("Under Development!")');
            } else {
              lines.push('- **Unbuilt routes**: All nav routes are built');
            }

            lines.push('- **Content source**: `cv.md` is the canonical CV text; `Resume.html` renders a subset of it. Update both when resume content changes.');
            lines.push('- **Git**: Default branch is `main`; deploys straight from repo root to GitHub Pages. Keep everything relative-pathed (`./style.css`, not absolute paths).');

            if (leetcodeApi) {
              lines.push('');
              lines.push('## API Integrations');
              lines.push('');
              lines.push('- **LeetCode**: `' + leetcodeApi + '` (with graceful degradation on failure)');
            }
            if (githubUser) {
              if (!leetcodeApi) {
                lines.push('');
                lines.push('## API Integrations');
              }
              lines.push('- **GitHub**: `api.github.com/users/' + githubUser + '` for stats and repos');
            }
            if (latestPost) {
              lines.push('');
              lines.push('## Latest Blog Post');
              lines.push('');
              lines.push('- **' + latestPost.title + '** (' + latestPost.category + ')');
            }

            lines.push('');
            lines.push('## When making changes');
            lines.push('');
            lines.push('1. New page \u2192 copy the header/footer structure from an existing page, add its own CSS file, link `style.css` first.');
            lines.push('2. Style changes \u2192 prefer editing `style.css` variables/components over page-specific overrides.');
            lines.push('3. Responsive changes \u2192 use the 720px breakpoint convention.');
            lines.push('4. After edits, verify by opening the affected pages directly in a browser \u2014 there is no linter, test suite, or build step.');

            fs.writeFileSync('README.md', lines.join('\n'));
            console.log('README.md fully regenerated from repo analysis');

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: auto-update README from repo analysis [skip ci]"
          git push
