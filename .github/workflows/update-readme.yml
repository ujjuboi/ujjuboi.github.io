name: Update README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze repo and regenerate README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function loadGitignore(dir) {
              var gitignorePath = path.join(dir, '.gitignore');
              if (!fs.existsSync(gitignorePath)) return [];
              return fs.readFileSync(gitignorePath, 'utf8')
                .split('\n')
                .map(function(l) { return l.trim(); })
                .filter(function(l) { return l && !l.startsWith('#'); })
                .filter(function(l) { return !l.startsWith('!'); });
            }

            function gitignoreGlobToRegex(pattern) {
              var p = pattern;
              var dirOnly = p.endsWith('/');
              if (dirOnly) p = p.slice(0, -1);
              var escaped = p
                .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                .replace(/\*\*/g, '\u0000')
                .replace(/\*/g, '[^/]*')
                .replace(/\u0000/g, '.*');
              return { re: new RegExp('^' + escaped + '$'), dirOnly: dirOnly };
            }

            function patternsForDir(dir) {
              return loadGitignore(dir).map(gitignoreGlobToRegex);
            }

            function isGitignored(name, isDir, dirPatterns) {
              return dirPatterns.some(function(g) {
                if (g.dirOnly && !isDir) return false;
                return g.re.test(name);
              });
            }

            function walkDir(dir, prefix) {
              prefix = prefix || '';
              var dirPatterns = patternsForDir(dir);
              var entries = fs.readdirSync(dir, { withFileTypes: true })
                .filter(function(e) {
                  if (e.name === '.git' || e.name === 'node_modules' || e.name === '.github' || e.name === 'plan' || e.name === '.gitignore') return false;
                  return !isGitignored(e.name, e.isDirectory(), dirPatterns);
                })
                .sort(function(a, b) {
                  if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
                  return a.name.localeCompare(b.name);
                });

              var lines = [];
              for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                var isLast = i === entries.length - 1;
                var connector = isLast ? '\u2514\u2500\u2500 ' : '\u251C\u2500\u2500 ';
                var childPrefix = isLast ? '    ' : '\u2502   ';

                if (entry.isDirectory()) {
                  var dirPath = path.join(dir, entry.name);
                  var children = walkDir(dirPath, prefix + childPrefix);
                  lines.push(prefix + connector + entry.name + '/');
                  lines = lines.concat(children);
                } else {
                  lines.push(prefix + connector + entry.name);
                }
              }
              return lines;
            }

            function getLatestPost() {
              var manifestPath = 'src/Blogs/posts.json';
              if (!fs.existsSync(manifestPath)) return null;
              try {
                var filenames = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                if (filenames.length === 0) return null;
                var mdPath = 'src/Blogs/' + filenames[0];
                if (!fs.existsSync(mdPath)) return null;
                var lines = fs.readFileSync(mdPath, 'utf8').split('\n');
                var meta = {};
                for (var li = 0; li < lines.length; li++) {
                  if (lines[li].startsWith('## Paragraphs')) break;
                  var m = lines[li].match(/^## (\w+):\s*(.+)/);
                  if (m) meta[m[1].toLowerCase()] = m[2].trim();
                }
                if (meta.title) return { title: meta.title, category: meta.category || '' };
              } catch (e) {}
              return null;
            }

            function getLeetcodeApi() {
              var projectsPath = 'pages/Projects/Projects.html';
              if (!fs.existsSync(projectsPath)) return null;
              var content = fs.readFileSync(projectsPath, 'utf8');
              var match = content.match(/https:\/\/leetcode-stats\.tashif\.codes\/[\w]+/);
              return match ? match[0] : null;
            }

            function getGitHubUser() {
              var projectsPath = 'pages/Projects/Projects.html';
              if (!fs.existsSync(projectsPath)) return null;
              var content = fs.readFileSync(projectsPath, 'utf8');
              var match = content.match(/api\.github\.com\/users\/[\w-]+/);
              return match ? match[0].split('/').pop() : null;
            }

            function resolveRelative(baseFile, href) {
              var normalized = href;
              if (normalized.startsWith('./')) normalized = normalized.slice(2);
              var baseDir = path.dirname(baseFile);
              return path.normalize(path.join(baseDir, normalized));
            }

            function detectNoticeRoutes() {
              var files = ['index.html', 'pages/Resume/Resume.html', 'pages/Blog/Blog.html', 'pages/Projects/Projects.html'];
              var routes = [];
              for (var fi = 0; fi < files.length; fi++) {
                var file = files[fi];
                if (!fs.existsSync(file)) continue;
                var content = fs.readFileSync(file, 'utf8');
                var anchors = content.match(/<a[^>]*>[\s\S]*?<\/a>/g) || [];
                for (var ai = 0; ai < anchors.length; ai++) {
                  if (/\sonclick="notice\(\)"/.test(anchors[ai])) {
                    var labelMatch = anchors[ai].match(/>([^<]*)<\/a>/);
                    var label = labelMatch ? labelMatch[1].trim() : null;
                    if (label) routes.push(label);
                  }
                }
              }
              return routes.filter(function(v, i, a) { return a.indexOf(v) === i; });
            }

            function getPageInfo(filePath) {
              if (!fs.existsSync(filePath)) return null;
              var content = fs.readFileSync(filePath, 'utf8');

              function collect(pattern) {
                var out = [];
                var re = new RegExp(pattern, 'g');
                var m;
                while ((m = re.exec(content)) !== null) out.push(m[1]);
                return out;
              }

              var cssLinks = collect('href="([^"]*\\.css)"');
              var scriptSrcs = collect('src="([^"]*\\.js)"');

              var styles = cssLinks.map(function(c) { return path.basename(c); });
              var scripts = scriptSrcs.map(function(s) { return path.basename(s); });

              var pageScriptSrc = scriptSrcs.filter(function(s) { return path.basename(s) !== 'shared.js'; })[0] || null;
              var jsContent = '';
              if (pageScriptSrc && !pageScriptSrc.startsWith('http')) {
                var jsPath = resolveRelative(filePath, pageScriptSrc);
                if (fs.existsSync(jsPath)) jsContent = fs.readFileSync(jsPath, 'utf8');
              }

              var details = [];

              if (jsContent.includes('setGreet') || content.includes('salutation')) {
                details.push('Time-based greeting into `#salutation`');
              }
              if (jsContent.includes('renderBlogList') || jsContent.includes('showPost')) {
                details.push('Renders posts from `posts.json` manifest; `renderBlogList()` grouped by category; `showPost()`/`showBlogList()` view-swap');
              }
              if (jsContent.includes('toggleBlogSection')) {
                details.push('`toggleBlogSection()` collapsible categories');
              }
              if (jsContent.includes('toggleSection') || content.includes('toggleSection')) {
                details.push('`toggleSection()` collapsible sections (+/- icons)');
              }
              if (jsContent.includes('fetchLeetCodeStats') || content.includes('leetcode-stats')) {
                details.push('LeetCode stats via third-party API (`fetchLeetCodeStats()`)');
              }
              if (jsContent.includes('fetchGitHubStats') || content.includes('api.github.com')) {
                details.push('GitHub repos/stats via GitHub API (`fetchGitHubStats()`)');
              }
              if (jsContent.includes('fetchRecentActivity')) {
                details.push('Recent activity / commit via GitHub API (`fetchRecentActivity()`)');
              }
              if (scripts.indexOf('shared.js') !== -1) {
                details.push('`shared.js` (`notice()`, dropdown + footer `menuIcon` toggle via `initMenuToggle()`)');
              }

              return { styles: styles, scripts: scripts, details: details };
            }

            var fileTreeLines = walkDir('.', '');
            var fileTree = fileTreeLines.join('\n');

            var pageList = ['index.html'];
            var dirs = fs.readdirSync('pages', { withFileTypes: true })
              .filter(function(d) { return d.isDirectory(); })
              .map(function(d) { return d.name; });

            for (var di = 0; di < dirs.length; di++) {
              var htmlPath = 'pages/' + dirs[di] + '/' + dirs[di] + '.html';
              if (fs.existsSync(htmlPath)) {
                pageList.push(htmlPath);
              }
            }

            var pageRows = '';
            var pageStylesByPage = [];
            var pageScriptsByPage = [];
            for (var pi = 0; pi < pageList.length; pi++) {
              var info = getPageInfo(pageList[pi]);
              if (info) {
                var stylesLabel = info.styles.map(function(s) { return '`' + s + '`'; }).join(' + ');
                var scriptsLabel = info.scripts.map(function(s) { return '`' + s + '`'; }).join(', ');
                var detailsLabel = info.details.join('; ') || 'N/A';
                pageRows += '| `' + pageList[pi] + '` | ' + stylesLabel + ' | ' + scriptsLabel + ' | ' + detailsLabel + ' |\n';

                pageStylesByPage.push(info.styles);
                pageScriptsByPage.push(info.scripts);
              }
            }

            function sharedAcross(perPage) {
              if (perPage.length === 0) return [];
              return perPage[0].filter(function(f) {
                return perPage.every(function(list) { return list.indexOf(f) !== -1; });
              });
            }

            var sharedStyles = sharedAcross(pageStylesByPage);
            var sharedScripts = sharedAcross(pageScriptsByPage);

            var noticeRoutes = detectNoticeRoutes();
            var leetcodeApi = getLeetcodeApi();
            var githubUser = getGitHubUser();
            var latestPost = getLatestPost();

            var lines = [];
            lines.push('# BlowGrrr');
            lines.push('Making my own dynamic blogging website!');
            lines.push('<a href="https://ujjuboi.github.io/">Check It Out!</a>');
            lines.push('');
            lines.push('## Main Objectives:');
            lines.push('* Learn Model View Control Framework');
            lines.push('* HTML Semantics');
            lines.push('* CSS & SASS media queries');
            lines.push('* JavaScript & Responsiveness');
            lines.push('');
            lines.push('---');
            lines.push('');
            lines.push('# Project Map (for AI agents)');
            lines.push('');
            lines.push('> Reference this section instead of re-scanning the repo. Static portfolio site: plain HTML + external vanilla JS/CSS files. **No build system, no package manager, no dependencies** \u2014 files are served as-is via GitHub Pages. To preview locally, just open `index.html` in a browser.');
            lines.push('');
            lines.push('## File tree');
            lines.push('');
            lines.push('```');
            lines.push(fileTree);
            lines.push('```');
            lines.push('');
            lines.push('## Page inventory');
            lines.push('');
            lines.push('| Page | CSS files | JS files | Behavior |');
            lines.push('|---|---|---|---|');
            lines.push(pageRows);
            lines.push('## Key details / conventions');
            lines.push('');
            lines.push('- **Shared header/footer**: The `<header>` (brand + nav dropdown) and footer social-SVG block are **duplicated verbatim across pages** \u2014 any nav or footer change must be applied to every page. `.active` class marks the current page\'s nav link. Sub-pages use `<body class="sub-page">`; `index.html` does not.');
            var sharedCssLabel = sharedStyles.length ? sharedStyles.map(function(s) { return '`' + s + '`'; }).join(', ') : 'none';
            var sharedJsLabel = sharedScripts.length ? sharedScripts.map(function(s) { return '`' + s + '`'; }).join(', ') : 'none';
            lines.push('- **Shared JS/CSS**: Files loaded by every page: CSS ' + sharedCssLabel + '; JS ' + sharedJsLabel + '. `scripts/shared.js` provides `notice()`, nav-dropdown logic, and the footer `menuIcon` toggle (`initMenuToggle()`); `styles/style.css` holds the custom-property theme. Page-specific logic lives in `scripts/{home,blog,projects,resume}.js` and page CSS in `styles/{Blog,Projects,Resume}.css`. Load order: `style.css` (\+ `common.css` on sub-pages) first, then page CSS, then `shared.js` before the page script. Put cross-page JS in `shared.js`, cross-page CSS in `common.css`.');
            lines.push('- **Theming**: All colors and fonts come from CSS custom properties in `:root` of `style.css` (`--borderColor`, `--backgroundColor`, `--shadowColor`, `--contentColor`, `--headings`, `--poppins`, etc.). Never hardcode colors \u2014 use the variables. Fonts are imported at the top of `style.css`.');
            lines.push('- **Layout**: `index.html` is a full-height grid hero; sub-pages use `body.sub-page` and scroll normally (they do **not** use `overflow:hidden`). Sections are often collapsible (`toggleSection()` / `toggleBlogSection()` with +/- icons). Uses `720px` breakpoint for responsive work.');
            lines.push('- **Visual language**: Beige background, black borders, offset solid box-shadows (`--shadowColor`), rounded corners. Reuse existing patterns (`.card`, `.skill-item`, `.stat-card` styling) rather than inventing new ones.');
            lines.push('- **Assets**: `Images/` holds shared assets: `MyImage.jpg` (hero photo) plus social/menu/signature SVGs plus `Images/Graphics/` (blog/project banner art). Footer social icons are inline SVGs in the HTML, not `<img>` tags.');

            if (noticeRoutes.length > 0) {
              lines.push('- **Unbuilt routes**: ' + noticeRoutes.map(function(r) { return '`' + r + '`'; }).join(', ') + ' currently call `notice()` ("Under Development!")');
            } else {
              lines.push('- **Unbuilt routes**: All nav routes are built');
            }

            lines.push('- **Content source**: `src/cv.md` is the canonical CV text; `Resume.html` renders it via `scripts/resume.js`. `src/Blogs/posts.json` is the blog manifest (ordered list of `src/Blogs/*.md`); `Blog.html` renders via `scripts/blog.js`. Update the relevant source when content changes.');
            lines.push('- **Git**: Default branch is `main`; deploys straight from repo root to GitHub Pages. Keep everything relative-pathed (`./style.css`, `../../styles/common.css`), never absolute paths.');

            if (leetcodeApi) {
              lines.push('');
              lines.push('## API Integrations');
              lines.push('');
              lines.push('- **LeetCode**: `' + leetcodeApi + '` (with graceful degradation on failure)');
            }
            if (githubUser) {
              if (!leetcodeApi) {
                lines.push('');
                lines.push('## API Integrations');
              }
              lines.push('- **GitHub**: `api.github.com/users/' + githubUser + '` for stats and repos');
            }
            if (latestPost) {
              lines.push('');
              lines.push('## Latest Blog Post');
              lines.push('');
              lines.push('- **' + latestPost.title + '** (' + latestPost.category + ')');
            }

            lines.push('');
            lines.push('## When making changes');
            lines.push('');
            lines.push('1. New page \u2192 copy the header/footer + `<script>`/stylesheet block from an existing sub-page, keep the `pages/<Name>/<Name>.html` convention, and add `scripts/<name>.js` + `styles/<Name>.css`.');
            lines.push('2. Cross-page JS \u2192 put it in `scripts/shared.js`; cross-page CSS \u2192 `styles/common.css`. Page-specific \u2192 the page\'s own file.');
            lines.push('3. Style changes \u2192 prefer editing `style.css` variables/components over page-specific overrides.');
            lines.push('4. Responsive changes \u2192 use the 720px breakpoint convention.');
            lines.push('5. After edits, verify by opening the affected pages directly in a browser \u2014 there is no linter, test suite, or build step.');

            fs.writeFileSync('README.md', lines.join('\n'));
            console.log('README.md fully regenerated from repo analysis');
            console.log('Page inventory rows:');
            console.log(pageRows);

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: auto-update README from repo analysis [skip ci]"
          git push
