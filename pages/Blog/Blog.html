        title: "Scaling Identity Data Ingestion: MongoDB at Enterprise Scale",
        date: "August 22, 2026",
        excerpt: "How we optimized a data ingestion pipeline to process 18M group memberships in 4 hours — from 10 to 1,500 records/sec.",
        banner: "../../Images/Graphics/MongoDB.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>When I joined DI App Factory at Deloitte as Software Engineer, our team was tasked with building a data ingestion pipeline capable of handling millions of records across multiple identity sources — Active Directory, SailPoint, Okta, PingFederate, and AWS IAM. The scale was staggering: seventeen million group membership records, MongoDB ingest rates stuck at ten records per second, and client datasets containing hundreds of millions of records. The challenge wasn't just storage — it was throughput.</p>",
          "<p>The first breakthrough came from profiling the ingestion pipeline. Initial profiling revealed that our write pattern was the bottleneck, not CPU or memory. We were performing too many individual <code>findOneAndUpdate</code> operations, each requiring separate network round-trips, locks, and index updates. The solution required replacing individual operations with bulk write operations, implementing new indexing strategies to reduce fragmentation, and optimizing batch sizes to align with MongoDB's internal buffer configurations. Combined, these improvements increased ingestion rates from ten to fifteen hundred records per second — a 150x improvement.</p>",
          "<p>The implications were dramatic. What previously would have taken days of continuous processing could now be completed in three to four hours — a 90% reduction in processing time. Bulk import throughput improved from 100K to 400K records per batch (500% increase), enabling us to ingest 18 million group membership records within standard maintenance windows.</p>",
          "<p>Another bottleneck emerged from network latency: the EC2 instance running the application and the MongoDB server were in different network locations, adding milliseconds per operation that compounded into hours over millions of records. The fix was straightforward — move the database server to the same location as the application server — but it highlighted a key lesson: every optimization creates new constraints that must be managed.</p>",
          "<p>Architecturally, we led a design study comparing DDX's S3 + MongoDB GridFS approach against Service Center's methodology. DDX's architecture leverageaged S3 for object storage with GridFS for chunked file handling while maintaining MongoDB's native query capabilities. However, after weighing AWS compliance overhead (data residency, encryption key management, access logging) against performance needs, we determined that optimizing existing MongoDB operations was the more practical solution for our client scenarios.</p>",
          "<p>On the data modeling side, I redesigned how group memberships were stored. Instead of embedding group references within user documents, I created a dedicated group membership collection that stores object references between groups, users, and applications. This normalized schema allows complex membership hierarchies — including nested groups — to be resolved efficiently with proper indexing, critical for datasets with millions of users across thousands of groups.</p>",
          "<p>We also migrated DDX's data classification and use cases features into App Factory, creating a cross-platform capability that identified orphan groups, inactive service accounts, and permission patterns across any identity source — not just directory data. The ingestion error tracking we built served as a quality gate: custom business rulesets verified schema, referential integrity, and anomaly detection before data touched the database, with ruleset deployment managed through configuration rather than code.</p>",
          "<p>The overarching lesson: at enterprise scale, the difference between a good system and a great one isn't measured in features — it's in hundreds of records per second, hours of processing time saved, and the confidence that data quality checks caught problems before they caused harm.</p>"

        title: "Teaching Machines to Read Legal Documents",
        date: "August 10, 2026",
        excerpt: "Building an NLP pipeline that turns PDFs, DOCs, and DOCX legal files into structured JSON — section extraction with SpaCy, multi-format parsing, and the dataset problem that stalled our custom NER model.",
        banner: "../../Images/Graphics/LegalDocuments.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>Legal documents have a way of actively resisting structure. Court judgments, appeals, petitions — each one arrives in a different template, a different format, with its own idea of where the parties end and the submissions begin. Anyone who has had to manually inspect a stack of these documents knows how slow and error-prone the process is. So I built a tool with one goal: take any legal document and emit structured JSON capturing its key features and entities, so the information inside can be consumed programmatically instead of skimmed by eye.</p>",
          "<p>The architecture stayed deliberately simple: three small modules, each with a single responsibility. <code>parseDocument.py</code> is the orchestrator — it scans a folder of incoming documents, dispatches each to the right converter based on its extension, feeds the extracted text through the section detector, and writes one <code>.json</code> file per input document. <code>fileConverter.py</code> knows nothing about law; it only knows how to get text out of files. <code>sections.py</code> knows nothing about file formats; it only knows how to find structure in lines of text.</p>",
          "<p>The converter layer turned out to be its own little museum of format quirks. PDFs go through pdfminer, walking page by page with a <code>PDFPageInterpreter</code> and a <code>TextConverter</code>, accumulating text across the whole document. Modern Word files (<code>.docx</code>) are handled by docx2txt, legacy <code>.doc</code> files fall back to the textract library, and plain text files are read directly. The critical design decision was normalizing everything into a common shape — a full text string plus a list of lines — so the downstream NLP layer never needed to care where the document came from. Working with real-world files taught me quickly how inconsistent exports are: stray tabs from Word, page-break artifacts in PDFs, encoding oddities in old formats.</p>",
          "<p>The heart of the system is section detection. I curated a vocabulary of headings that appear in legal paperwork — \"date of hearing,\" \"date of judgment,\" \"solicitor,\" \"counsel,\" \"parties,\" \"submission,\" statute references like IPC and FCA, and court names — alongside general structural headings like \"background\" and \"conclusion.\" Every line in the document goes through the same pipeline: lowercase it, run it through SpaCy for lemmatization, tokenize it with NLTK, and strip stopwords like \"of,\" \"and,\" and \"&.\" If the surviving tokens are three or fewer and the result matches a known heading, that line marks a section boundary.</p>",
          "<p>The normalization step matters more than it looks. \"Awards & Achievements\" and \"awards achievements\" collapse to the same form; singular and plural headings unify under lemmatization. The three-token length guard is equally important — it stops sentences that merely contain words like \"court\" or \"judge\" from falsely splitting the document mid-narrative. Once the boundaries are marked, all the lines between two boundaries are joined into a single clean paragraph (empty lines and dash separators stripped) and stored under their heading's key.</p>",
          "<p>The output is one JSON file per document: keys are section names, values are the corresponding paragraphs. A consumer asking for the \"reason\" section of a judgment gets it directly, without ever touching raw text parsing again. It's a small capability, but it completely changes what downstream automation can build on top of the corpus.</p>",
          "<p>I'll be honest about what we didn't achieve, because it shaped the whole project. The original plan was to train our own named entity recognition model in SpaCy 3.0 — tagging judges, counsel, statutes, and cited cases automatically. That requires an annotated corpus: text plus character-offset spans marking each entity. We found the UCI Legal Case Reports dataset, and while converting it into SpaCy's training format (a tuple of text and entity spans, serialized to pickle) was mechanically straightforward, the dataset simply wasn't elaborate enough for a robust model. Rather than ship a weak NER component, we shipped the deterministic pipeline and documented the exact training format for whoever picks the model work up later.</p>",
          "<p>The biggest lessons from this project: reach for rules and classical NLP before deep learning, especially when your labeled data is thin; data availability is the real constraint on ML ambitions, not model architecture; and nothing teaches you about messy real-world data faster than parsing hundreds of documents nobody standardized. The whole pipeline is open-sourced on my GitHub — sometimes the most valuable tool isn't the cleverest model, it's the boring reliable one that turns chaos into JSON.</p>"
        ]

      {
        title: "Teaching CI to Think: Agentic Workflows on GitHub Actions",
        date: "June 30, 2026",
        excerpt: "How we turned a modular monolith migration plan, code review, linting, PR descriptions, documentation, and regression tests into autonomous AI-powered GitHub Actions workflows.",
        banner: "../../Images/Graphics/GithubActions.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>Between December 2025 and June 2026, we served as Software Engineers on Deloitte's DI App Factory team. The most interesting work wasn't a feature on the product roadmap — it was turning our own software development lifecycle into software. We built a family of AI-powered <em>agentic workflows</em> on GitHub Actions that reviewed code, enforced standards, described changes, updated documentation, and generated regression tests — autonomously, but safely.</p>",
          "<p>Before agents came architecture. We designed our migration roadmap from modular monolith to microservices using domain-driven design: event-storming sessions mapped core domains (identity correlation, ingestion, analytics, workflow orchestration) into bounded contexts with explicit ownership boundaries. Each context got a contract — synchronous REST for query paths, asynchronous event-based communication for state changes. The deliverable was a sequenced roadmap letting teams extract services incrementally, starting with the context that had the fewest inbound dependencies.</p>",
          "<p>The agentic workflows tackled mechanical judgment — work that needs intelligence but not creativity. Workflows live in Markdown files: prose instructions plus YAML front matter declaring which LLM engine to run (Copilot, Claude, or Codex), which toolsets are allowed, and which outputs the agent may produce. The <code>gh aw</code> CLI compiles these inside GitHub Actions, so an 'AI step' is just another pipeline step — versioned in git, reviewable in a PR, and observable like any other job.</p>",
          "<p>Guardrails mattered more than model choice. Every workflow ran under least privilege: read-only token by default, explicit tool allowlist, no direct write access. All agent output flowed through <em>safe outputs</em> — structured channels turning suggestions into review comments, labels, or issues — never direct commits. PR payloads contained untrusted content; workflows treated them as input data, never instructions. Pinning action versions, capping duration, and keeping every decision auditable in run logs were non-negotiable.</p>",
          "<p>The first workflow shipped was the <strong>Grumpy Code Reviewer</strong>. Built on <code>tools.github</code>, it pulled PR diffs, walked changed files with repository context, and left line-anchored comments — blunt about error handling, unforgiving about missing test coverage, opinionated about naming. The persona reduced nitpicking ambiguity and made feedback consistent across reviewers. It ran on every <code>pull_request</code> event, so authors got feedback in minutes. Human review didn't disappear; it got faster because reviewers stopped spending attention on mechanical issues the agent flagged.</p>",
          "<p>Intelligent lint-checking combined classic tooling with contextual judgment. A bash toolset executed real linters, while repository context tools fed the agent our actual conventions — directory structure, module boundaries, patterns from neighboring code. The agent flagged things static configs couldn't: duplicated utilities, API routes bypassing middleware, components importing across bounded-context lines. Severities separated cleanly: standards violations failed checks, stylistic suggestions landed as non-blocking annotations. One especially valuable rule prevented drive-by reformats that inflated diffs and buried real logic in review noise.</p>",
          "<p>PR descriptions went from paperwall to context-commits. A workflow combined <code>issues</code> and <code>pull_requests</code> toolsets: fetched the linked issue, diffed the branch, asked a summarization agent to reconcile them. Output followed a fixed contract — concise summary, bullet changes grouped by concern, testing notes, risk callouts. Safe outputs wrote it into the PR description field. Every PR now documented its scope, linked context, and blast radius — making review and later archaeology dramatically easier. Release notes nearly wrote themselves.</p>",
          "<p>Documentation drift was the next target. We built <em>Continuous AI</em> workflows on a schedule — cron-triggered GitHub Actions using <code>web-fetch</code> and <code>web-search</code> to watch upstream sources: API definitions, changelogs, internal wiki pages. When relevant content changed, the agent drafted Confluence updates producing diff-style summaries pushed through safe-output integrations. Documentation reviews became small, frequent, and current instead of pre-release scrambles.</p>",
          "<p>Regression testing was the most ambitious. Using Playwright, an agent received three inputs — issue context, PR metadata, and browser automation access to staging — and generated end-to-end test specs covering affected flows. Generated tests were reviewed like code before entering the suite; existing regression packs executed as release-validation gates. LLM browser automation fails loudly: a mismatched selector or unexpected flow produces evidence, not silent passes. Generated specs required human approval — test authoring automated, test judgment never abdicated.</p>",
          "<p>Engine choice (Copilot, Claude, Codex) was thresholded and configured per task, not hardwired. Long-context models handled sprawling diffs holding whole changes plus linked issues in view; faster models excelled at narrow jobs like description summarization. Prompt structure mattered more than model brand. Every prompt followed the same skeleton — role, scope, output contract, constraints — and we iterated against a small corpus of past PRs as an evaluation set. Treating prompts as tested artifacts, not incantations, was probably the single highest-leverage habit we built.</p>",
          "<p>Agents failed instructively. Early reviewers invented file paths (hallucination), so we required findings to cite concrete files and line ranges pulled through tool calls, not model memory. Over-eager agents produced comment spam; we tuned severity thresholds, deduplicated across runs, capped comments per PR. Silent partial failures eroded trust fast — steps validated their own outputs and failed loudly when something looked wrong. Each incident became a permanent evaluation case, replayed against future prompt changes.</p>",
          "<p>Six months in, the takeaway: agents amplify process quality in both directions. With contracts, scoped permissions, and safe outputs, they compress hours of mechanical judgment into minutes. Without them, they compress chaos too. Start with one narrow workflow, measure it like production software, keep guardrails boring — and let the interesting part be what your team builds once the busywork runs itself.</p>"
        ]
      },
      {
        title: "Getting into AI/ML Agents",
        date: "February 17, 2026",
        excerpt: "My journey from writing scripts to building autonomous AI agents — the tools, frameworks, and lessons learned along the way.",
        banner: "../../Images/Graphics/Mind.svg",
        category: "Research",
        paragraphs: [
          "<p>Artificial Intelligence has always fascinated me, but it wasn't until I started working with Large Language Models (LLMs) that I truly understood what 'intelligence' in a machine could mean. The concept of agents — systems that can reason, plan, and act autonomously — is reshaping how we think about software.</p>",
          "<p>My entry into this space began with LangChain, which provided the perfect abstraction for connecting LLMs with external tools and data sources. I built my first agent: a research assistant that could search the web, extract information from documents, and synthesize findings into structured reports.</p>",
          "<p>The agent framework revolves around three components: the LLM engine (which I've experimented with using Claude, Codex, and various local models), the tool execution layer (which handles API calls, file operations, and web fetching), and the orchestration layer (which breaks down complex tasks into manageable sub-plans).</p>",
          "<p>One of the most impactful projects I've built is an AI-powered code workflow system using GitHub Actions. The agent reviews pull requests, checks for maintainability issues, generates documentation, and even creates test cases — all autonomously. The key lesson I learned was that guardrails are just as important as capabilities; an agent without proper constraints can cause as much harm as it can help.</p>",
          "<p>The future of software engineering will involve human-AI collaboration, not human-AI competition. I'm excited to keep building in this space and learning from the rapidly evolving agent ecosystem.</p>"

      {
        title: "Side Projects & Building for Fun",
        date: "December 14, 2025",
        excerpt: "Why I build side projects, the tools I love, and a technical deep dive into building a CLI movie ticket booking system in C++ and other solo projects.",
        banner: "../../Images/Graphics/Movie.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>There's a special kind of creativity that comes from building things simply because you want to. While my day job at Deloitte keeps me busy with enterprise-scale identity governance platforms and real-time sensor dashboards, my side projects are where I explore fundamentals, experiment with different languages, and push my learning boundaries.</p>",
          "<p>One of the most intense solo projects I've built was a CLI movie ticket booking system in C++. The goal wasn't just to build something fun — it was to deeply understand OOP principles in a systems language. I implemented the three pillars of OOP: encapsulation through private member access and public interfaces for movie, hall, and ticket classes; inheritance with a base Booking class and specialized subclasses for VIP, Regular, and Premium tiers; and abstraction where each component exposes only the necessary methods while hiding internal state.</p>",
          "<p>The system handles a full booking workflow: users browse a menu to select movies, choose showtimes across multiple halls, and pick specific seats from a dynamically generated seat map. Each hall's seat layout was generated through a function that could be parameterized for different configurations. Customer data — name, mobile number, email — goes through input validation with regex checks; the system rejects invalid mobile numbers and malformed emails, re-entering until valid input is provided.</p>",
          "<p>Persistence was handled through C++ file I/O. Each successful booking generated a unique user_id using the built-in rand() function, and customer data was appended to a text file — no database, just raw file handles and stream formatting. This taught me a great deal about data serialization, formatting guards, and handling edge cases like duplicate entries or partial writes. The booking flow also included a payment simulation that validated UPI IDs by checking for the @ symbol, mirroring real payment workflows.</p>",
          "<p>Beyond the CLI project, I've built a real-time sensor dashboard using MQTT and WebSockets for IoT data streaming, a personal task automation tool using GitHub Actions templates, and a silly but fun tool that analyzes my reading and music habits to generate personalized recommendations using basic clustering. The stack matters less than shipping — I default to Next.js for web frontends, Express or FastAPI for APIs, and SQLite or MongoDB when I actually need persistence. But sometimes the best learning happens in a single .cpp file with no frameworks at all.</p>",
          "<p>If you're a developer who hasn't started a side project yet, I'd encourage you to. The skills you develop — self-direction, rapid prototyping, and the courage to ship imperfect work — translate directly to your professional life in ways you wouldn't expect. And even if the project never goes anywhere, the technical muscles you flex along the way will serve you when the next enterprise challenge comes knocking.</p>"

      {
        title: "Real-time Sensor Dashboards w/ MQTT & WebSockets",
        date: "November 8, 2025",
        excerpt: "Building a real-time monitoring system with 0.3ms downtime using MQTT, Pub/Sub, and WebSockets for remote sensor data streaming.",
        banner: "../../Images/Graphics/SensorData.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>In the world of IoT, real-time data is everything. Over the past few months, I've been working on a sensor data communication project that streams live telemetry from remote sensors to a web dashboard with minimal latency.</p>",
          "<p>The architecture leverages MQTT as the message broker protocol, with a Pub/Sub model that distributes sensor data to multiple subscribers in real-time. WebSockets serve as the bridge between the backend and the frontend, providing a persistent full-duplex connection.</p>",
          "<p>The Django backend handles message routing, buffering, and storage. Using Django Channels, WebSocket connections are maintained for each connected dashboard client. The result is a system that achieves 0.3ms downtime during message bursts — a significant reliability improvement over HTTP polling.</p>",
          "<p>One of the key challenges was handling sensor message queuing under high throughput. I implemented a priority queue system in Redis that ensures critical sensor alerts are delivered immediately, while routine telemetry is batched efficiently.</p>",
          "<p>This project became open-source, and I've published the core architecture on GitHub. It serves as a solid foundation for any real-time sensor dashboard project, from home automation to industrial monitoring.</p>"

    const categories = ['Deloitte', 'Personal Projects', 'Research'];

    function renderBlogList() {
      const container = document.getElementById('blog-list');
      container.innerHTML = '';
      let delayIndex = 0;
      categories.forEach(category => {
        const grouped = posts
          .map((post, index) => ({ post, index }))
          .filter(item => item.post.category === category);
        if (!grouped.length) return;

        const section = document.createElement('div');
        section.className = 'blog-section';

        const heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.textContent = category;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'post-grid';

        grouped.forEach(({ post, index }) => {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.style.animationDelay = (delayIndex * 0.1) + 's';
          card.onclick = () => showPost(index);
          card.innerHTML = `
            <h3 class="card-title">${post.title}</h3>
            <p class="card-date">${post.date}</p>
            <p class="card-excerpt">${post.excerpt}</p>
          `;
          grid.appendChild(card);
          delayIndex++;
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function showPost(index) {
      const post = posts[index];
      document.getElementById('blog-list').style.display = 'none';
      const postView = document.getElementById('post-view');
      postView.style.display = 'block';

      document.getElementById('post-banner').src = post.banner;
      document.getElementById('post-banner').alt = post.title;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-date').textContent = post.date;

      const content = document.getElementById('post-content');
      content.innerHTML = '';
      post.paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'post-paragraph';
        div.innerHTML = p;
        content.appendChild(div);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showBlogList() {
      document.getElementById('post-view').style.display = 'none';
      document.getElementById('blog-list').style.removeProperty('display');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.nav-dropdown.dropdown-open').forEach(function(el) {
        el.classList.remove('dropdown-open');
      });
    }

    document.addEventListener('click', function(e) {
      var dropdowns = document.querySelectorAll('.nav-dropdown');
      if (!dropdowns.length) return;
      var clickedInsideDropdown = false;
      dropdowns.forEach(function(dropdown) {
        if (dropdown.contains(e.target)) clickedInsideDropdown = true;
      });
      if (!clickedInsideDropdown) {
        closeAllDropdowns();
      }
    });

    var navDropdowns = document.querySelectorAll('.nav-dropdown > a');
    navDropdowns.forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var parent = this.parentElement;
        var wasOpen = parent.classList.contains('dropdown-open');
        closeAllDropdowns();
        if (!wasOpen) {
          parent.classList.add('dropdown-open');
        }
      });
    });

    var themeSelect = document.getElementById('themeSelect');
    var footer = document.querySelector('footer');
    var menuIcon = document.getElementById('menuIcon');
    var header = document.querySelector('header');
    var blogContainer = document.getElementById('blog-container');
    var root = document.querySelector(":root");
    var menu = document.getElementById("menu");
    var selectedTheme = document.getElementById("selectedTheme");
    var white = document.getElementById("whiteTheme");
    var dark = document.getElementById("darkTheme");
    var color = document.getElementById("colorTheme");

    if(window.innerWidth <= 720){
      themeSelect.addEventListener('click', () => {
        menu.style.position = "relative";
        menu.style.opacity = "1";
        menu.style.visibility = "visible";
      });

      blogContainer.addEventListener('click', () => {
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
      });

      menuIcon.addEventListener('click', () => {
        menuIcon.style.display = "none";
        header.style.display = "block";
        blogContainer.style.display = "none";
        footer.style.height = "10vh";
        footer.style.bottom = "1%";
        themeSelect.style.display = "none";
        closeAllDropdowns();
      });

      footer.addEventListener('click', () => {
        menuIcon.style.display = "block";
        footer.style.height = "18vh";
        footer.style.bottom = "4%";
        header.style.display = "none";
        blogContainer.style.display = "block";
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
        themeSelect.style.display = "block";
        closeAllDropdowns();
      });
    }

    function darkTheme(){
      menu.replaceChild(replace(), dark);
      selectedTheme.insertBefore(dark, selectedTheme.children[0]);
      let darkObj = new DarkTheme;
      document.querySelector('body').style.color = darkObj.border;
      root.style.setProperty('--borderColor', darkObj.border);
      root.style.setProperty('--backgroundColor', darkObj.bg);
      root.style.setProperty('--shadowColor', darkObj.shadow);
      root.style.setProperty('--contentColor', darkObj.content);
    }

    function colorTheme(){
      menu.replaceChild(replace(), color);
      selectedTheme.insertBefore(color, selectedTheme.children[0]);
      let colorObj = new ColorTheme;
      document.querySelector('body').style.color = colorObj.border;
      root.style.setProperty('--borderColor', colorObj.border);
      root.style.setProperty('--backgroundColor', colorObj.bg);
      root.style.setProperty('--shadowColor', colorObj.shadow);
      root.style.setProperty('--contentColor', colorObj.content);
    }

    function lightTheme(){
      menu.replaceChild(replace(), white);
      selectedTheme.insertBefore(white, selectedTheme.children[0]);
      let whiteObj = new WhiteTheme;
      document.querySelector('body').style.color = whiteObj.border;
      root.style.setProperty('--borderColor', whiteObj.border);
      root.style.setProperty('--backgroundColor', whiteObj.bg);
      root.style.setProperty('--shadowColor', whiteObj.shadow);
      root.style.setProperty('--contentColor', whiteObj.content);
    }

    function replace(){
      var insideTheme = null;
      for(var i = 0; i < selectedTheme.childNodes.length; i++){
        if(selectedTheme.childNodes[i].className == "menuItem"){
          insideTheme = selectedTheme.childNodes[i];
          break;
        }
      }
      return insideTheme;
    };

    renderBlogList();
  </script>
</body>
</html>
