<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Teaching CI to Think: Agentic Workflows on GitHub Actions</title>
  <desc id="desc">A dark technical illustration showing a pull request flowing through guarded AI agents and GitHub Actions into review, documentation, linting, and regression testing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <circle cx="1210" cy="160" r="230" fill="#6366f1" opacity=".10" filter="url(#softGlow)"/>
  <circle cx="370" cy="500" r="200" fill="#06b6d4" opacity=".07" filter="url(#softGlow)"/>

  <!-- Header -->
  <text x="90" y="105"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="54" font-weight="800" fill="#f8fafc">
    Teaching CI to Think
  </text>

  <text x="92" y="151"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="25" font-weight="500" fill="#93c5fd">
    Agentic Workflows on GitHub Actions
  </text>

  <text x="94" y="190"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" letter-spacing="2" fill="#64748b">
    SAFE • AUDITABLE • LEAST PRIVILEGE • HUMAN IN THE LOOP
  </text>

  <!-- Main flow line -->
  <path d="M190 390 C370 285 470 285 610 350
           S860 470 1010 350 S1260 250 1450 330"
        fill="none" stroke="#38bdf8" stroke-opacity=".12"
        stroke-width="16" filter="url(#softGlow)"/>

  <path d="M190 390 C370 285 470 285 610 350
           S860 470 1010 350 S1260 250 1450 330"
        fill="none" stroke="url(#cyan)" stroke-width="2"
        stroke-dasharray="7 10" marker-end="url(#arrow)"
        opacity=".9"/>

  <!-- Pull Request -->
  <g transform="translate(95 300)">
    <rect width="205" height="150" rx="18" fill="#0f1d31"
          stroke="#334155" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="20" fill="#1d4ed8" opacity=".22"/>
    <path d="M30 38h16M38 30v16" stroke="#60a5fa" stroke-width="2.5"
          stroke-linecap="round"/>
    <text x="25" y="83" font-family="Inter, sans-serif"
          font-size="18" font-weight="700" fill="#f1f5f9">Pull Request</text>
    <text x="25" y="108" font-family="ui-monospace, monospace"
          font-size="12" fill="#64748b">diff + issue + context</text>
    <rect x="25" y="123" width="91" height="5" rx="2.5" fill="#334155"/>
    <rect x="25" y="123" width="62" height="5" rx="2.5" fill="#38bdf8"/>
  </g>

  <!-- Agent brain -->
  <g transform="translate(535 255)">
    <circle cx="105" cy="95" r="93" fill="#6366f1" opacity=".12" filter="url(#glow)"/>
    <rect x="15" y="5" width="180" height="180" rx="28"
          fill="#111c32" stroke="url(#purple)" stroke-width="2"/>

    <!-- Neural/agent symbol -->
    <circle cx="105" cy="75" r="29" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="94" cy="68" r="4" fill="#67e8f9"/>
    <circle cx="116" cy="68" r="4" fill="#67e8f9"/>
    <path d="M91 84 Q105 94 119 84" fill="none"
          stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>

    <path d="M75 75H54M156 75H135M105 46V28M105 124V144"
          stroke="#818cf8" stroke-width="2"/>
    <circle cx="50" cy="75" r="5" fill="#22d3ee"/>
    <circle cx="160" cy="75" r="5" fill="#22d3ee"/>
    <circle cx="105" cy="24" r="5" fill="#34d399"/>
    <circle cx="105" cy="148" r="5" fill="#34d399"/>

    <text x="105" y="170" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="16"
          font-weight="700" fill="#f8fafc">AGENT</text>
  </g>

  <!-- Guardrails -->
  <g transform="translate(780 295)">
    <rect width="190" height="142" rx="18" fill="#0d1b2c"
          stroke="#10b981" stroke-opacity=".65"/>
    <path d="M95 22 L125 34 V62 C125 82 112 99 95 108
             C78 99 65 82 65 62 V34 Z"
          fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <path d="M81 62l9 9 20-22" fill="none"
          stroke="#6ee7b7" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="127" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="15"
          font-weight="700" fill="#d1fae5">SAFE OUTPUTS</text>
  </g>

  <!-- Outputs -->
  <g font-family="Inter, sans-serif">
    <!-- Review -->
    <g transform="translate(1110 185)">
      <rect width="190" height="92" rx="15" fill="#101c2d" stroke="#334155"/>
      <circle cx="30" cy="31" r="11" fill="#f59e0b" opacity=".9"/>
      <path d="M24 31h12" stroke="#111827" stroke-width="2"/>
      <text x="52" y="35" font-size="15" font-weight="700" fill="#f8fafc">Code Review</text>
      <text x="20" y="62" font-size="11" fill="#64748b">line-anchored findings</text>
      <text x="20" y="78" font-size="11" fill="#64748b">severity + evidence</text>
    </g>

    <!-- Lint -->
    <g transform="translate(1325 275)">
      <rect width="190" height="92" rx="15" fill="#101c2d" stroke="#334155"/>
      <circle cx="30" cy="31" r="11" fill="#38bdf8"/>
      <path d="M25 31h10M30 26v10" stroke="#082f49" stroke-width="2"/>
      <text x="52" y="35" font-size="15" font-weight="700" fill="#f8fafc">Contextual Lint</text>
      <text x="20" y="62" font-size="11" fill="#64748b">architecture + conventions</text>
      <text x="20" y="78" font-size="11" fill="#64748b">blocking vs advisory</text>
    </g>

    <!-- Docs -->
    <g transform="translate(1090 390)">
      <rect width="190" height="92" rx="15" fill="#101c2d" stroke="#334155"/>
      <circle cx="30" cy="31" r="11" fill="#a78bfa"/>
      <path d="M25 26h10v11H25z" fill="none" stroke="#312e81" stroke-width="2"/>
      <text x="52" y="35" font-size="15" font-weight="700" fill="#f8fafc">Docs Drift</text>
      <text x="20" y="62" font-size="11" fill="#64748b">scheduled source checks</text>
      <text x="20" y="78" font-size="11" fill="#64748b">drafted updates</text>
    </g>

    <!-- Tests -->
    <g transform="translate(1305 485)">
      <rect width="190" height="92" rx="15" fill="#101c2d" stroke="#334155"/>
      <circle cx="30" cy="31" r="11" fill="#34d399"/>
      <path d="M24 31l5 5 8-10" fill="none" stroke="#064e3b"
            stroke-width="2.5" stroke-linecap="round"/>
      <text x="52" y="35" font-size="15" font-weight="700" fill="#f8fafc">Regression Tests</text>
      <text x="20" y="62" font-size="11" fill="#64748b">Playwright + staging</text>
      <text x="20" y="78" font-size="11" fill="#64748b">human-reviewed specs</text>
    </g>
  </g>

  <!-- Tool / engine strip -->
  <g transform="translate(420 535)">
    <rect width="570" height="70" rx="16" fill="#0a1424"
          stroke="#1e3a5f"/>
    <text x="28" y="29" font-family="ui-monospace, monospace"
          font-size="11" letter-spacing="1.5" fill="#64748b">CONFIGURABLE ENGINE</text>
    <text x="28" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#cbd5e1">
      Copilot
    </text>
    <text x="125" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#64748b">•</text>
    <text x="148" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#cbd5e1">Claude</text>
    <text x="238" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#64748b">•</text>
    <text x="260" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#cbd5e1">Codex</text>
    <text x="350" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#64748b">•</text>
    <text x="373" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#cbd5e1">LangChain</text>
    <text x="475" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#64748b">•</text>
    <text x="498" y="51" font-family="Inter, sans-serif"
          font-size="15" font-weight="600" fill="#cbd5e1">Playwright</text>
  </g>

  <!-- Bottom principles -->
  <g transform="translate(95 625)" font-family="ui-monospace, monospace"
     font-size="12" fill="#64748b">
    <text x="0">least privilege</text>
    <text x="170">│</text>
    <text x="195">pinned actions</text>
    <text x="355">│</text>
    <text x="380">timeouts</text>
    <text x="475">│</text>
    <text x="500">auditable logs</text>
    <text x="665">│</text>
    <text x="690">prompts as code</text>
    <text x="860">│</text>
    <text x="885" fill="#34d399">human approval</text>
  </g>

  <!-- Decorative terminal cursor -->
  <g transform="translate(1400 80)">
    <rect width="105" height="34" rx="8" fill="#0a1424" stroke="#1e293b"/>
    <text x="14" y="23" font-family="ui-monospace, monospace"
          font-size="13" fill="#34d399">$ gh aw</text>
  </g>
</svg>