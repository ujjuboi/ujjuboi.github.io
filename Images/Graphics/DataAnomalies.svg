  <!-- TRANSPARENT BACKGROUND -->

  <!-- Use case icons: Font Awesome Free "Classic Solid"
       (fontawesome.com) — CC BY 4.0.
       Orphan Groups: user-group + xmark ·
       Inactive Service Accounts: user-gear + clock ·
       Stale Users: user + clock -->

  <defs>
