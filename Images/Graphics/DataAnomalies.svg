              fill="#2563EB"/>
      <rect x="72" y="248" width="120" height="12" rx="6" fill="#2563EB" fill-opacity=".65"/>
      <rect x="90" y="268" width="84" height="12" rx="6" fill="#2563EB" fill-opacity=".4"/>
      <rect x="106" y="288" width="52" height="12" rx="6" fill="#2563EB" fill-opacity=".25"/>
      <circle cx="234" cy="96" r="42"
              fill="#FFFFFF"
              stroke="#2563EB"
              stroke-width="8"/>
      <path transform="translate(211 73) scale(0.0898)"
              d="M256 0a256 256 0 1 1 0 512 256 256 0 1 1 0-512zM232 120l0 136c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2 280 120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"
              fill="#2563EB"/>

    <text x="150" y="355"
          text-anchor="middle"
