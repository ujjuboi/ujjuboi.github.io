<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="700" viewBox="0 0 1600 700">

  <!-- TRANSPARENT BACKGROUND -->

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
                     flood-color="#17324D" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- ORPHAN GROUP -->

  <g transform="translate(100 90)">

    <circle cx="150" cy="180" r="125"
            fill="#FEE2E2" filter="url(#shadow)"/>

    <!-- Group -->
    <circle cx="115" cy="165" r="18" fill="#DC2626"/>
    <circle cx="170" cy="165" r="18" fill="#DC2626"/>

    <path d="M80 220 C80 180 150 180 150 220"
          fill="none" stroke="#DC2626"
          stroke-width="12" stroke-linecap="round"/>

    <path d="M145 220 C145 180 215 180 215 220"
          fill="none" stroke="#DC2626"
          stroke-width="12" stroke-linecap="round"/>

    <!-- Broken ownership link -->
    <path d="M205 150 L255 110"
          stroke="#DC2626"
          stroke-width="9"
          stroke-dasharray="13 12"
          stroke-linecap="round"/>

    <circle cx="270" cy="98" r="25"
            fill="#FFFFFF"
            stroke="#DC2626"
            stroke-width="7"/>

    <path d="M259 87 L281 109 M281 87 L259 109"
          stroke="#DC2626"
          stroke-width="6"
          stroke-linecap="round"/>

    <text x="150" y="355"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#17324D">
      Orphan Groups
    </text>
  </g>


  <!-- INACTIVE SERVICE ACCOUNT -->

  <g transform="translate(500 90)">

    <circle cx="150" cy="180" r="125"
            fill="#FEF3C7" filter="url(#shadow)"/>

    <!-- Service account -->
    <circle cx="125" cy="165" r="22"
            fill="#D97706"/>

    <path d="M88 220 C88 185 162 185 162 220"
          fill="none"
          stroke="#D97706"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- Gear -->
    <circle cx="175" cy="190" r="27"
            fill="#FFFFFF"
            stroke="#D97706"
            stroke-width="7"/>

    <circle cx="175" cy="190" r="9"
            fill="#D97706"/>

    <path d="M175 155 V145
             M175 235 V225
             M140 190 H130
             M220 190 H210
             M151 166 L144 159
             M206 221 L199 214
             M199 166 L206 159
             M144 221 L151 214"
          stroke="#D97706"
          stroke-width="7"
          stroke-linecap="round"/>

    <!-- Clock -->
    <circle cx="230" cy="105" r="38"
            fill="#FFFFFF"
            stroke="#B45309"
            stroke-width="7"/>

    <path d="M230 105 V82
             M230 105 L246 116"
          stroke="#B45309"
          stroke-width="6"
          stroke-linecap="round"/>

    <text x="150" y="355"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#17324D">
      Inactive Service Accounts
    </text>
  </g>


  <!-- STALE USER -->

  <g transform="translate(900 90)">

    <circle cx="150" cy="180" r="125"
            fill="#DBEAFE" filter="url(#shadow)"/>

    <!-- User -->
    <circle cx="150" cy="145" r="28"
            fill="#2563EB"/>

    <path d="M105 215 C105 170 195 170 195 215"
          fill="none"
          stroke="#2563EB"
          stroke-width="13"
          stroke-linecap="round"/>

    <!-- Fading trail -->
    <path d="M105 245 H195"
          stroke="#5B8DEF"
          stroke-width="10"
          stroke-linecap="round"
          opacity=".65"/>

    <path d="M120 270 H180"
          stroke="#8FB1F5"
          stroke-width="9"
          stroke-linecap="round"
          opacity=".4"/>

    <path d="M137 292 H163"
          stroke="#B7CDF8"
          stroke-width="8"
          stroke-linecap="round"
          opacity=".25"/>

    <!-- Clock -->
    <circle cx="225" cy="105" r="37"
            fill="#FFFFFF"
            stroke="#2563EB"
            stroke-width="7"/>

    <path d="M225 105 V84
             M225 105 L241 115"
          stroke="#2563EB"
          stroke-width="6"
          stroke-linecap="round"/>

    <text x="150" y="355"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#17324D">
      Stale Users
    </text>
  </g>


  <!-- GROUP RELATIONSHIP ANOMALY -->

  <g transform="translate(1300 90)">

    <circle cx="150" cy="180" r="125"
            fill="#EDE9FE" filter="url(#shadow)"/>

    <!-- Nested groups -->
    <rect x="75" y="135"
          width="115" height="85"
          rx="15"
          fill="#C4B5FD"
          stroke="#7C3AED"
          stroke-width="8"/>

    <rect x="115" y="175"
          width="115" height="85"
          rx="15"
          fill="#FFFFFF"
          stroke="#7C3AED"
          stroke-width="8"/>

    <!-- Circular dependency -->
    <path d="M205 105
             C260 110 280 165 260 210"
          fill="none"
          stroke="#7C3AED"
          stroke-width="9"
          stroke-linecap="round"/>

    <path d="M260 210 L262 180 L235 192"
          fill="none"
          stroke="#7C3AED"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <text x="150" y="355"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#17324D">
      Group Relationship Anomalies
    </text>
  </g>

</svg>