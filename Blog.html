  <script>
    function notice(){
      alert("Under Development!");

    const posts = [
      {
        title: "Classifying Legal Documents with Machine Learning",
        date: "August 18, 2026",
        excerpt: "Building an NLP pipeline to automatically classify legal documents using tokenization, TF-IDF vectorization, and cosine similarity — developed during a summer internship.",
        banner: "./Images/Graphics/LegalDocuments.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>During a summer internship, I was tasked with a project that combined my love for NLP with the practical need for legal document management. The challenge was straightforward but deceptively complex: build a system that could automatically categorize legal documents into predefined sections based on their content. This became the ClassifyingLegalDocuments project, which I've since open-sourced on GitHub.</p>",
          "<p>The approach I took drew heavily from my experience building a resume parser earlier. Parsing unstructured text documents — whether resumes or legal files — requires robust tokenization, meaningful feature extraction, and reliable similarity matching. Those same principles applied here, but with the added complexity of highly specialized legal language and varied document structures.</p>",
          "<p>The pipeline works through a series of well-defined steps. First, the system parses the raw document and converts the text into tokens. These tokens are then transformed into TF-IDF (Term Frequency-Inverse Document Frequency) vectors, capturing the importance of each word relative to the document as a whole. The core classification logic uses cosine similarity to compare each document's vector representation against a predefined set of categories defined in <code>sections.py</code>.</p>",
          "<p>The categories themselves are defined in a <code>sectionListRaw</code> list — a curated collection of document section labels that serve as the reference points for classification. For each incoming document, the system computes the cosine similarity between the document's TF-IDF vector and the vectors representing each section in the predefined list. The document is then categorized into the section with the highest similarity score. This approach, while not the most advanced, proved effective enough for the task and made the system interpretable and easily extensible.</p>",
          "<p>One of the highlights of this project was discovering how much transferable knowledge exists between different parsing problems. The techniques I used for extracting structured information from resumes — tokenization strategies, stop-word filtering, and similarity-based matching — translated almost directly to the legal domain. The project reinforced a key lesson: many NLP problems share a common foundation, and the real engineering value is in understanding which levers to pull for your specific domain.</p>",
          "<p>The code is organized as a reproducible pipeline: input documents flow through parsing, tokenization, vectorization, and classification in a clean, readable flow. I've kept the core logic lightweight so it can be extended — whether that means swapping in transformer-based embeddings, adding a confidence scoring layer, or integrating the pipeline into a larger document management system.</p>"
        ]
      },
      {
        title: "Real-time Sensor Dashboards w/ MQTT & WebSockets",
        date: "August 15, 2026",
        excerpt: "Building a real-time monitoring system with 0.3ms downtime using MQTT, Pub/Sub, and WebSockets for remote sensor data streaming.",
        banner: "./Images/Graphics/SensorData.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>In the world of IoT, real-time data is everything. Over the past few months, I've been working on a sensor data communication project that streams live telemetry from remote sensors to a web dashboard with minimal latency.</p>",
          "<p>The architecture leverages MQTT as the message broker protocol, with a Pub/Sub model that distributes sensor data to multiple subscribers in real-time. WebSockets serve as the bridge between the backend and the frontend, providing a persistent full-duplex connection.</p>",
          "<p>The Django backend handles message routing, buffering, and storage. Using Django Channels, WebSocket connections are maintained for each connected dashboard client. The result is a system that achieves 0.3ms downtime during message bursts — a significant reliability improvement over HTTP polling.</p>",
          "<p>One of the key challenges was handling sensor message queuing under high throughput. I implemented a priority queue system in Redis that ensures critical sensor alerts are delivered immediately, while routine telemetry is batched efficiently.</p>",
          "<p>This project became open-source, and I've published the core architecture on GitHub. It serves as a solid foundation for any real-time sensor dashboard project, from home automation to industrial monitoring.</p>"
        ]
      },
      {
        title: "Getting into AI/ML Agents",
        date: "July 28, 2026",
        excerpt: "My journey from writing scripts to building autonomous AI agents — the tools, frameworks, and lessons learned along the way.",
        banner: "./Images/Graphics/Mind.svg",
        category: "Research",
        paragraphs: [
          "<p>Artificial Intelligence has always fascinated me, but it wasn't until I started working with Large Language Models (LLMs) that I truly understood what 'intelligence' in a machine could mean. The concept of agents — systems that can reason, plan, and act autonomously — is reshaping how we think about software.</p>",
          "<p>My entry into this space began with LangChain, which provided the perfect abstraction for connecting LLMs with external tools and data sources. I built my first agent: a research assistant that could search the web, extract information from documents, and synthesize findings into structured reports.</p>",
          "<p>The agent framework revolves around three components: the LLM engine (which I've experimented with using Claude, Codex, and various local models), the tool execution layer (which handles API calls, file operations, and web fetching), and the orchestration layer (which breaks down complex tasks into manageable sub-plans).</p>",
          "<p>One of the most impactful projects I've built is an AI-powered code workflow system using GitHub Actions. The agent reviews pull requests, checks for maintainability issues, generates documentation, and even creates test cases — all autonomously. The key lesson I learned was that guardrails are just as important as capabilities; an agent without proper constraints can cause as much harm as it can help.</p>",
          "<p>The future of software engineering will involve human-AI collaboration, not human-AI competition. I'm excited to keep building in this space and learning from the rapidly evolving agent ecosystem.</p>"
        ]
      },
      {
        title: "Identity Governance & Lessons from Access Control",
        date: "July 10, 2026",
        excerpt: "What I learned working on enterprise identity governance platforms and why access control matters more than you think.",
        banner: "./Images/Graphics/DataAnomalies.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>Identity governance (also known as Identity Governance and Administration, or IGA) is one of those enterprise topics that sounds dry until you realize it's the backbone of every secure digital system. During my time working on the DDPX project at Deloitte, I got hands-on experience with the complex world of identity data analytics and governance.</p>",
          "<p>The core challenge? Managing access permissions across thousands of users, groups, and roles in large organizations. My work involved designing and implementing Role-Based Access Control (RBAC) systems that whitelist specific APIs while denying everything by default — a principle I now consider essential security architecture.</p>",
          "<p>One of the most eye-opening experiences was integrating with external Identity Providers like Okta (SAML), OAuth 2.0 providers, AWS Cognito, and Microsoft Azure Graph. Each provider has its own authentication model, and figuring out how they interoperate in a unified system was a Masterclass in distributed identity.</p>",
          "<p>I also developed ownership attribution algorithms that use both deterministic methods (direct user-role mappings) and probabilistic approaches using LLM-powered analysis to handle edge cases. These algorithms achieved 95% accuracy in identifying the rightful owners of privileged entities across datasets of 100,000+ records.</p>",
          "<p>These experiences taught me a fundamental lesson that applies beyond identity security: design systems with the principle of least privilege, build observability in from day one, and never underestimate the complexity of real-world data.</p>"
        ]
      },
      {
        title: "Side Projects & Building for Fun",
        date: "June 22, 2026",
        excerpt: "Why I build side projects, the tools I love, and a few fun things I've created outside of work.",
        banner: "./Images/Graphics/Movie.svg",
        category: "Personal Projects",
        paragraphs: [
          "<p>There's a special kind of creativity that comes from building things simply because you want to. While my day job at Deloitte keeps me busy with enterprise-scale identity governance platforms, my side projects are where I explore, experiment, and push my learning boundaries.</p>",
          "<p>The best side projects, in my experience, are the ones that solve a problem you personally have. A few that I'm proud of include a real-time sensor dashboard for monitoring environmental conditions, a personal task automation tool using GitHub Actions templates, and various small web apps built during hackathon weekends.</p>",
          "<p>My approach to building is: start simple, iterate fast, and refactor when the mess becomes interesting. I default to Next.js for web frontends, Express or FastAPI for APIs, and SQLite or MongoDB for data. The stack matters less than shipping — you can always revisit and refine.</p>",
          "<p>One of the most fun projects I've built was a tool that analyzes my reading and music habits to generate personalized recommendations using basic clustering. It's silly, it's useless for anyone else, and it's exactly the kind of thing I love building.</p>",
          "<p>If you're a developer who hasn't started a side project yet, I'd encourage you to. The skills you develop — self-direction, rapid prototyping, and the courage to ship imperfect work — translate directly to your professional life in ways you wouldn't expect.</p>"
        ]
      },
      {
        title: "Legacy Stacks vs Modern Frameworks",
        date: "June 5, 2026",
        excerpt: "Surviving and thriving with PHP and legacy systems while learning the latest modern frameworks — a perspective from the trenches.",
        banner: "./Images/Graphics/php.png",
        category: "Research",
        paragraphs: [
          "<p>Let me set the record straight: legacy technologies aren't dead. In fact, they power a massive portion of the web that most modern framework evangelists forget exists. My early development work with PHP and traditional server-side architectures taught me things that no React tutorial ever could.</p>",
          "<p>Working with PHP during my academic and early professional years gave me a deep understanding of request-response lifecycle, server-side rendering, and the fundamentals of web architecture. Before I touched a single component or hook, I knew how HTTP actually works, how sessions are managed, and how data flows from database to browser.</p>",
          "<p>Transitioning to modern frameworks like Next.js and Django felt like leveling up, but it wasn't a replacement — it was an evolution. Understanding the old way made learning the new way intuitive. When I use Server-Side Rendering in Next.js, I understand exactly what happened in the PHP days that led to its creation.</p>",
          "<p>The key insight: don't romanticize legacy code or dismiss it. Respect what it achieved with limited tools, and apply that same practical thinking to your modern stack. The best engineers I know write modern code with the wisdom of systems that survived the pre-cloud era.</p>",
          "<p>That said, I do miss the simplicity of a well-crafted PHP script served from a single file. Sometimes the answer is just... a file. Or is it? (Still debating this one.)</p>"
        ]
      }
    ];

    const categories = ['Deloitte', 'Personal Projects', 'Research'];

    function renderBlogList() {
      const container = document.getElementById('blog-list');
      container.innerHTML = '';
      let delayIndex = 0;
      categories.forEach(category => {
        const grouped = posts
          .map((post, index) => ({ post, index }))
          .filter(item => item.post.category === category);
        if (!grouped.length) return;

        const section = document.createElement('div');
        section.className = 'blog-section';

        const heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.textContent = category;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'post-grid';

        grouped.forEach(({ post, index }) => {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.style.animationDelay = (delayIndex * 0.1) + 's';
          card.onclick = () => showPost(index);
          card.innerHTML = `
            <h3 class="card-title">${post.title}</h3>
            <p class="card-date">${post.date}</p>
            <p class="card-excerpt">${post.excerpt}</p>
          `;
          grid.appendChild(card);
          delayIndex++;
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function showPost(index) {
      const post = posts[index];
      document.getElementById('blog-list').style.display = 'none';
      const postView = document.getElementById('post-view');
      postView.style.display = 'block';

      document.getElementById('post-banner').src = post.banner;
      document.getElementById('post-banner').alt = post.title;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-date').textContent = post.date;

      const content = document.getElementById('post-content');
      content.innerHTML = '';
      post.paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'post-paragraph';
        div.innerHTML = p;
        content.appendChild(div);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showBlogList() {
      document.getElementById('post-view').style.display = 'none';
      document.getElementById('blog-list').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    var themeSelect = document.getElementById('themeSelect');
    var footer = document.querySelector('footer');
    var menuIcon = document.getElementById('menuIcon');
    var header = document.querySelector('header');
    var blogContainer = document.getElementById('blog-container');
    var root = document.querySelector(":root");
    var menu = document.getElementById("menu");
    var selectedTheme = document.getElementById("selectedTheme");
    var white = document.getElementById("whiteTheme");
    var dark = document.getElementById("darkTheme");
    var color = document.getElementById("colorTheme");

    if(window.innerWidth <= 720){
      themeSelect.addEventListener('click', () => {
        menu.style.position = "relative";
        menu.style.opacity = "1";
        menu.style.visibility = "visible";
      });

      blogContainer.addEventListener('click', () => {
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
      });

      menuIcon.addEventListener('click', () => {
        menuIcon.style.display = "none";
        header.style.display = "block";
        blogContainer.style.display = "none";
        footer.style.height = "10vh";
        footer.style.bottom = "1%";
        themeSelect.style.display = "none";
      });

      footer.addEventListener('click', () => {
        menuIcon.style.display = "block";
        footer.style.height = "18vh";
        footer.style.bottom = "4%";
        header.style.display = "none";
        blogContainer.style.display = "block";
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
        themeSelect.style.display = "block";
      });
    }

    function darkTheme(){
      menu.replaceChild(replace(), dark);
      selectedTheme.insertBefore(dark, selectedTheme.children[0]);
      let darkObj = new DarkTheme;
      document.querySelector('body').style.color = darkObj.border;
      root.style.setProperty('--borderColor', darkObj.border);
      root.style.setProperty('--backgroundColor', darkObj.bg);
      root.style.setProperty('--shadowColor', darkObj.shadow);
      root.style.setProperty('--contentColor', darkObj.content);
    }

    function colorTheme(){
      menu.replaceChild(replace(), color);
      selectedTheme.insertBefore(color, selectedTheme.children[0]);
      let colorObj = new ColorTheme;
      document.querySelector('body').style.color = colorObj.border;
      root.style.setProperty('--borderColor', colorObj.border);
      root.style.setProperty('--backgroundColor', colorObj.bg);
      root.style.setProperty('--shadowColor', colorObj.shadow);
      root.style.setProperty('--contentColor', colorObj.content);
    }

    function lightTheme(){
      menu.replaceChild(replace(), white);
      selectedTheme.insertBefore(white, selectedTheme.children[0]);
      let whiteObj = new WhiteTheme;
      document.querySelector('body').style.color = whiteObj.border;
      root.style.setProperty('--borderColor', whiteObj.border);
      root.style.setProperty('--backgroundColor', whiteObj.bg);
      root.style.setProperty('--shadowColor', whiteObj.shadow);
      root.style.setProperty('--contentColor', whiteObj.content);
    }

    function replace(){
      var insideTheme = null;
      for(var i = 0; i < selectedTheme.childNodes.length; i++){
        if(selectedTheme.childNodes[i].className == "menuItem"){
          insideTheme = selectedTheme.childNodes[i];
          break;
        }
      }
      return insideTheme;
    };

    renderBlogList();
  </script>
</body>
