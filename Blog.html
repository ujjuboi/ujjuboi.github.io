        title: "Scaling Identity Data Ingestion: Architecture, Performance, and Lessons Learned at Enterprise Scale",
        date: "August 22, 2026",
        excerpt: "A deep technical dive into designing and optimizing a large-scale data ingestion pipeline for identity governance — from MongoDB performance tuning to architectural decision-making at Di App Factory.",
        banner: "./Images/Graphics/DataAnomalies.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>When I joined the DI App Factory team at Deloitte as a Software Engineer II, I was tasked with one of the most challenging aspects of enterprise identity governance: building a data ingestion pipeline capable of handling millions of records across multiple identity sources — Active Directory, SailPoint, Okta, PingFederate, AWS IAM, and beyond. The scale was staggering. We were talking about ingesting, transforming, and storing seventeen million group membership records, optimizing MongoDB operations from ten records per second to fifteen hundred records per second, and making critical architectural decisions that would define how the platform evolved for years to come.</p>",
          "<p>The journey began with an architectural design study comparing two data ingestion approaches: the existing DDX platform's methodology versus Service Center's approach. DDX leveraged an S3-based storage architecture combined with MongoDB GridFS, which offered exceptional scalability and fault tolerance. However, through rigorous analysis, I identified that DDX's S3 + MongoDB GridFS architecture enabled faster and more scalable processing than Service Center's alternative approach. The key differentiator was how each system handled large binary objects and structured identity data simultaneously. GridFS provided chunked storage for large files while maintaining MongoDB's native query capabilities, creating a dual-layer system that could handle both blob storage and document management without requiring separate infrastructure.</p>",
          "<p>One of the first major performance challenges I tackled was improving bulk import throughput. The existing system was processing one hundred thousand records per batch, which seemed adequate on paper but proved disastrous in practice when clients submitted datasets containing hundreds of millions of records. Through extensive profiling and iterative optimization, I engineered a series of improvements that increased throughput to four hundred thousand records per batch — a five hundred percent improvement. This wasn't achieved through a single magic bullet but through a combination of strategies: batch size optimization, reducing round-trip database communications, implementing parallel processing where safe, and most importantly, replacing individual <code>findOneAndUpdate</code> operations with bulk write operations.</p>",
          "<p>The MongoDB optimization story is particularly interesting. Initial profiling revealed that our ingestion rate had plateaued at approximately ten records per second, which was completely unacceptable for enterprise-scale data loads. The bottleneck wasn't CPU or memory — it was the database write pattern. We were performing too many individual update operations, each requiring network round trips, locking, and index maintenance. The solution required a comprehensive rethinking of how we structured our write operations. I implemented new indexing strategies that reduced index fragmentation, optimized batch sizes to align with MongoDB's internal buffer configurations, and replaced individual document updates with bulk write operations that grouped multiple operations into single network calls.</p>",
          "<p>The performance gains were dramatic and unexpected. After implementing these optimizations, we achieved ingestion rates of fifteen hundred records per second — a one hundred fifty-fold improvement over the baseline. More importantly, this optimization enabled us to ingest eighteen million group membership records in just three to four hours, representing a ninety percent reduction in processing time. The mathematical implications of this improvement cannot be overstated: what previously would have taken days of continuous processing could now be completed within standard maintenance windows, dramatically reducing client disruption and operational costs.</p>",
          "<p>Architectural decisions rarely exist in a vacuum — they're always balances between competing priorities. One of the most significant technical decisions I led was choosing between two fundamentally different approaches to handling data scalability. S3 uploads would have provided superior long-term scalability, with近乎-infinite storage capacity, built-in redundancy, and AWS's mature ecosystem of data processing tools. However, the additional AWS compliance overhead — including data residency requirements, encryption key management, access logging, and regulatory considerations for client data stored in public cloud storage — made this approach impractical for certain client scenarios. Instead, I made the decision to optimize existing MongoDB operations, which provided sufficient performance for our use case while maintaining data in a more controlled, compliance-friendly environment.</p>",
          "<p>This decision-making process taught me a crucial lesson about enterprise architecture: the theoretically optimal solution is rarely the practically optimal solution. S3 would have been the more scalable option in a vacuum, but the reality of compliance requirements, client constraints, and operational overhead made MongoDB optimization the more pragmatic choice. Architecture is not about building the perfect system; it's about building the right system for your specific context, constraints, and requirements.</p>",
          "<p>Another significant bottleneck emerged when profiling identified that data uploads were slowed by network latency between the EC2 instance server (where the application image was deployed) and the MongoDB server instance. These two services were running in different network locations, adding milliseconds of latency to every database operation. In a batch processing scenario with millions of records, these milliseconds compound into hours of unnecessary processing time. The solution was straightforward in concept but required careful planning in execution: move the database server to the same network location as the application server, eliminating inter-datacenter network latency entirely.</p>",
          "<p>This move reduced network latency during imports dramatically, but it also introduced new operational considerations. Co-locating the database and application servers means they share infrastructure risks, require more careful resource scaling, and introduce different failure modes. The trade-off was worth it for the performance gains, but it highlighted another architectural truth: every optimization creates new constraints that must be managed.</p>",
          "<p>The LDIF (LDAP Data Interchange Format) data ingestion component represented another major architectural challenge. We needed to ingest data representing users, computers, and groups from enterprise directories, but the existing data model was architected in a way that handled group memberships inefficiently. Group memberships in identity systems create a many-to-many relationship problem — users belong to groups, groups contain users, groups can contain other groups, and all of these relationships need to be queryable at scale.</p>",
          "<p>The solution required an architectural redesign of how we stored group membership data. Instead of embedding group membership references within user documents (which created data duplication and update complexity), I designed a dedicated group membership collection. This collection stores object references between groups, users, and applications, creating a normalized schema that is both space-efficient and query-optimized. When queried with proper indexing, this collection allows us to resolve complex membership hierarchies — including nested groups that contain other groups — with single-lookup efficiency. This design decision was critical to handling vertex-scale identity datasets where millions of users belong to thousands of groups with complex nesting structures.</p>",
          "<p>Beyond the raw ingestion pipeline, I worked extensively on schema attributes and their design to establish meaningful relationships between disparate identity sources. Our system ingests data from SailPoint, Okta, and PingFederate — each with their own data models, field names, and semantic interpretations of identity attributes. Mapping data points (applications, accounts, identities, entitlements, workstations) from these tools to directory users, groups, and computers required careful schema design that could accommodate differences while maintaining query efficiency.</p>",
          "<p>The schema design challenge was compounded by the fact that different identity providers use different data types for nearly identical concepts. Okta might represent an application as a complex object with nested properties, while PingFederate might represent the same concept as a flattened reference with external lookup tables. Creating a unified schema that could represent all these variations without excessive normalization or denormalization required deep understanding of both the technical data structures and the business semantics they represented.</p>",
          "<p>One of the most exciting aspects of this work was successfully migrating DDX's data classification, definition, and use cases features into App Factory, creating a cross-platform capability instead of restricting it to DDX-specific directory data. This migration transformed the feature from a single-purpose tool into a generalized utility that could identify orphan groups, inactive service accounts, and dangerous permission patterns across any identity source — not just Active Directory.</p>",
          "<p>This migration involved creating correlation logic that connected inactive service accounts in business applications to their associated groups and entitlements. The correlation algorithm had to handle cases where an account might be linked to a group through one identity source while the group's ownership was defined in another, requiring multi-dimensional lookups across the unified data model. The resulting system could trace the full lifecycle of permissions — from who requested access, through who approved it, to which groups and applications it granted, and whether any of those permissions were currently inactive or unused — providing a complete audit trail that security teams found invaluable.</p>",
          "<p>I also extended the existing feature to track and alert on data ingestion errors, creating what I call a quality gate check system. This system creates custom business rulesets that data is run upon before being written to the database, catching data quality issues before they propagate into the analytics layer. The quality gate operates at multiple levels: schema validation (ensuring required fields are present and correctly typed), referential integrity checking (ensuring linked entities actually exist), business rule validation (flagging records that violate organizational policies), and anomaly detection (using statistical methods to identify unusual patterns that might indicate data corruption or security incidents).</p>",
          "<p>The quality gate system was designed with flexibility in mind. Rather than hard-coding validation rules, I built a rule execution engine that allows security teams to define, modify, and deploy custom validation rulesets through configuration files. This means that when an organization adds a new compliance requirement or changes a business policy, the quality gates can be updated without requiring code changes, redeployment, or downtime. The rulesets are staged before being applied to incoming data, allowing administrators to test new rules against historical data and verify they catch the intended cases without affecting live processing.</p>",
          "<p>Creating business application-specific workflows became another significant piece of the puzzle. These workflows automated three critical identity governance processes: resolving shared groups (identifying groups with too many members or members from too many different departments), identifying potential owners of orphan groups (groups that no longer have an explicit owner and might contain stale permissions), and generating descriptions for entitlements based on historical metadata analysis.</p>",
          "<p>The shared group resolution workflow analyzed membership patterns across dozens of groups, identifying patterns where certain users appeared in unexpected group combinations that might indicate accounts broadly distributed without proper governance. The orphan group finder used temporal analysis — examining when a group became inactive, when its presumed owner last logged in, and whether the group's members had changed recently — to calculate ownership probability scores that helped security teams prioritize which groups needed investigation first.</p>",
          "<p>The entitlement description generator was particularly interesting from a technical standpoint. Instead of relying on static metadata from identity systems (which was often incomplete or outdated), the system analyzed historical usage patterns, access frequency, approval histories, and related permission changes to generate contextual descriptions of what each entitlement actually meant in practice. This transformed entitlement data from dry, technical identifiers into meaningful security intelligence that audit teams could actually use.</p>",
          "<p>Looking back at this body of work, the most important lessons weren't about any specific technology — they were about the practice of architectural decision-making at scale. The first lesson is that you cannot optimize what you haven't measured. Every improvement I made in the ingestion pipeline — the batch size tuning, the bulk write operations, the network co-location — was driven by profiling data that showed exactly where time was being spent. Without comprehensive observability into the system's behavior, optimization becomes guesswork, and guesswork is expensive.</p>",
          "<p>Second, I learned that performance and compliance are not opposing forces — they're complementary constraints that together define the solution space. Early in the project, there was a tendency to view compliance requirements as obstacles to performance, as if the two were in tension. The reality is more nuanced: compliance needs shape the architecture in ways that can actually enhance performance by forcing better design decisions, more careful data handling, and more robust error checking systems.</p>",
          "<p>Third, I learned that the hardest part of enterprise software engineering isn't the technical challenge — it's the organizational context. The MongoDB to S3 decision wasn't purely technical; it was about understanding client constraints, regulatory requirements, risk tolerance, and long-term operational expenses. The DB co-location decision wasn't just about reducing latency; it was about trading a known performance problem against unknown operational risks. Every technical decision in my role became a negotiation between engineering ideals and practical reality, between the system we would build if constraints didn't matter and the system that would actually deliver value to the people who needed it.</p>",
          "<p>The scale of identity data at enterprise organizations is often underestimated. We're not talking about customer databases or e-commerce inventories — we're talking about the fundamental identity fabric that holds together access controls across an entire organization. A single misconfiguration in how this data is stored, queried, or managed can create security vulnerabilities affecting thousands of users. The work done on DI App Factory wasn't just about building features; it was about building the infrastructure that keeps enterprise identity governance accurate, auditable, and secure.</p>",
          "<p>If there's one key takeaway from this experience, it's this: at enterprise scale, the difference between a good system and a great system isn't measured in features — it's measured in hundreds of records per second, in hours of processing time saved, in the confidence that data quality checks caught problems before they could cause harm. The marginal gains that seem invisible in small-scale systems become the difference between a system that works and one that scales. Understanding that difference — that the architecture of million-record systems requires fundamentally different thinking than the architecture of thousand-record systems — is what separates developers who build apps from engineers who build systems.</p>"
        ]
      },

          "<p>The architecture leverages MQTT as the message broker protocol, with a Pub/Sub model that distributes sensor data to multiple subscribers in real-time. WebSockets serve as the bridge between the backend and the frontend, providing a persistent full-duplex connection.</p>",

          "<p>Artificial Intelligence has always fascinated me, but it wasn't until I started working with Large Language Models (LLMs) that I truly understood what 'intelligence' in a machine could mean. The concept of agents — systems that can reason, plan, and act autonomously — is reshaping how we think about software.</p>",
          "<p>My entry into this space began with LangChain, which provided the perfect abstraction for connecting LLMs with external tools and data sources. I built my first agent: a research assistant that could search the web, extract information from documents, and synthesize findings into structured reports.</p>",
          "<p>The agent framework revolves around three components: the LLM engine (which I've experimented with using Claude, Codex, and various local models), the tool execution layer (which handles API calls, file operations, and web fetching), and the orchestration layer (which breaks down complex tasks into manageable sub-plans).</p>",
          "<p>One of the most impactful projects I've built is an AI-powered code workflow system using GitHub Actions. The agent reviews pull requests, checks for maintainability issues, generates documentation, and even creates test cases — all autonomously. The key lesson I learned was that guardrails are just as important as capabilities; an agent without proper constraints can cause as much harm as it can help.</p>",

      {
        title: "Directory Data Analytics and Identity Correlation at Scale",
        date: "July 10, 2026",
        excerpt: "Building visual graph-based analytics to find security vulnerabilities in identity data across Active Directory, AWS IAM, and Microsoft Entra ID.",
        banner: "./Images/Graphics/DataAnomalies.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>At Deloitte, I worked on DDPX — a large-scale identity data analytics platform that helps enterprises discover security vulnerabilities and governance issues hidden within their identity infrastructure. The tool ingests data from Active Directory, Microsoft Entra ID, AWS IAM, and other identity sources, then surfaces insights like orphan groups, inactive service accounts, and risky permission assignments.</p>",
          "<p>One of my first major contributions was designing and implementing Role-Based Access Control (RBAC) in Java for the monolithic application. Rather than layering permissions on after the fact, I created a whitelist of APIs and blocked everything else by default, using a multi-tenant handler built in SpringBoot. This principle — deny-then-allow — has since become something I apply to every system I design.</p>",
          "<p>Data visualization was where the real value emerged for end users. I built visual graph-based analytics using React Flow and ChartJS to map relationships between identities, groups, applications, and entitlements. These visualizations made it possible to spot complex attack paths and misconfigurations that tabular data would never reveal. I also correlated identity sources across platforms, connecting dots between directory users, AWS principals, and cloud identities that lived in siloed systems.</p>",
          "<p>I implemented integrations with external Identity Providers to make the tool more widely usable — setting up SAML with Okta, OAuth 2.0 flows, AWS Cognito, and Microsoft Azure Graph. Each IdP has its own authentication model and quirks, and learning how they interoperate taught me a lot about the broader identity ecosystem.</p>",
          "<p>For ownership attribution, I created algorithms that achieved 95% accuracy in identifying rightful owners of privileged entities. The system combined deterministic methods — like direct user-role mappings — with probabilistic approaches powered by LLM inference for edge cases. These algorithms were tested against datasets of 100,000+ records, and the results regularly helped clients uncover vulnerabilities and flag risky identity state that would otherwise go unnoticed.</p>",
          "<p>I also optimized the data presentation layer significantly. By implementing dynamic routing in Next.js, tuning API payloads, and adding pagination with Bootstrap Table, I reduced data load times by 50%. This wasn't just a technical exercise — it directly improved the speed and usability of analytics workflows that consultants ran against thousands of records.</p>",
          "<p>The broader lesson from this work is that identity data is rarely just about access control. It's about understanding relationships — between users and groups, between applications and entitlements, between cloud principals and directory accounts. The vulnerabilities organizations face are rarely in any single system; they emerge from the gaps between them. Building tools that connect these dots is where the real impact lies.</p>"
        ]

      {
        title: "Teaching CI to Think: Agentic Workflows on GitHub Actions",
        date: "June 30, 2026",
        excerpt: "How we turned a modular monolith migration plan, code review, linting, PR descriptions, documentation, and regression tests into autonomous AI-powered GitHub Actions workflows.",
        banner: "./Images/Graphics/Mind.svg",
        category: "Deloitte",
        paragraphs: [
          "<p>Between December 2025 and June 2026, I served as a Software Engineer 1 on Deloitte's DI App Factory team, working on a large-scale enterprise onboarding and governance platform. The day-to-day was what you would expect — developing, testing, and documenting features for a platform that thousands of users depend on. But the most interesting work wasn't a feature on the product roadmap at all. It was turning our own software development lifecycle into software: a family of AI-powered <em>agentic workflows</em>, built on GitHub Actions, that could review code, enforce standards, describe changes, update documentation, and generate regression tests — autonomously, but safely.</p>",
          "<p>Before the agents came architecture. One of my first major responsibilities was designing the migration roadmap to move our platform from a modular monolith toward microservices. The discipline here is domain-driven design: you don't split by technical layers, you split along business seams. We ran event-storming sessions, mapped the core domains — identity correlation, ingestion, analytics, workflow orchestration — and defined bounded contexts with explicit ownership boundaries. Each context got a contract: synchronous REST for query paths where callers needed immediate consistency, and asynchronous event-based communication for state changes, where eventual consistency was acceptable and resilience mattered more than latency. The deliverable wasn't code; it was a sequenced roadmap that let teams extract services incrementally without a big-bang rewrite, starting with the context that had the fewest inbound dependencies and the clearest data boundary.</p>",
          "<p>The agentic workflows grew out of a simple observation: a huge percentage of engineering effort is mechanical judgment — the kind of work that needs intelligence but not creativity. GitHub's agentic workflow tooling made that observation actionable. Workflows are defined in Markdown files: prose instructions plus YAML front matter that declares which LLM engine to run (GitHub Copilot, Claude, or Codex), which toolsets the agent may touch, and which outputs it is allowed to produce. The <code>gh aw</code> CLI compiles and runs these definitions inside GitHub Actions, so an 'AI step' is just another step in a pipeline — versioned in git, reviewable in a PR, and observable in the Actions log like any other job.</p>",
          "<p>The guardrail design mattered more than the model choice. Every workflow operated under least privilege: a read-only token by default, an explicit allowlist of tools, and no direct write access to the repository. All agent output flowed through <em>safe outputs</em> — structured channels that turn a model's suggestion into a review comment, a label, or an issue — rather than letting it push commits freely. Because pull requests contain untrusted content (anyone's diff can try to smuggle instructions into the model), each workflow treated the PR payload as input data, never as instruction. Pinning action versions, capping run duration, and keeping every decision auditable in the run logs were non-negotiable. An agent you can't audit is a liability, not an automation.</p>",
          "<p>The first workflow we shipped was the <strong>Grumpy Code Reviewer</strong>. Built on the <code>tools.github</code> integration, it pulled the pull request diff, walked the changed files with repository context, and left line-anchored review comments as a grumpy senior engineer would: blunt about error handling, allergic to dead code, unforgiving about missing test coverage for changed branches, and opinionated about naming. The persona wasn't a gimmick — tuning the reviewer's voice toward strictness measurably reduced nitpicking ambiguity and made its feedback consistent across reviewers. It ran on every <code>pull_request</code> event, so authors got substantive feedback in minutes instead of waiting for a human reviewer's next focus block. Human review didn't go away; it got faster, because reviewers stopped spending attention on mechanical issues the agent had already flagged.</p>",
          "<p>Next came intelligent lint-checking workflows. Traditional linters catch syntax and style; ours combined classic tooling with contextual judgment. A bash toolset executed the project's real linters and formatters, while repository context tools fed the agent our actual conventions — directory structure, module boundaries, patterns used by neighboring code. The agent could then flag things static configs can't express: a utility function duplicated instead of reused, an API route bypassing shared middleware, a component importing across bounded-context lines. Crucially, we separated severities: standards violations failed the check, while stylistic suggestions landed as non-blocking annotations. One rule proved especially valuable — preventing unnecessary code changes, like drive-by reformats that inflate diffs and bury real logic in review noise.</p>",
          "<p>Then we automated the humble pull request description. This workflow combined the <code>issues</code> and <code>pull_requests</code> toolsets: it fetched the linked issue, diffed the branch, and asked a summarization agent to reconcile the two — what was requested, what actually changed, and whether they match. The output followed a fixed contract: a concise summary, a bullet list of changes grouped by concern, testing notes, and risk callouts. Safe outputs wrote it into the PR description field, ready for the author to edit rather than write from scratch. The subtle win was consistency: every PR now documented its scope, its linked context, and its blast radius, which made both review and later archaeology dramatically easier. Release notes nearly wrote themselves.</p>",
          "<p>Documentation drift was our next target. Enterprises run on Confluence, and Confluence rots. We built <em>Continuous AI</em> workflows on a schedule — cron-triggered GitHub Actions that used <code>web-fetch</code> and <code>web-search</code> tools to watch upstream sources: API definitions, changelogs, internal wiki pages. When a relevant page changed, the agent drafted updates to the corresponding Confluence space, producing a diff-style summary of what changed and why, pushed through safe-output integrations rather than direct writes. Documentation reviews became small, frequent, and current instead of a pre-release scramble. Scheduled agents quietly became our documentation team's tireless intern — the kind that never gets bored of checking whether page 47 still matches reality.</p>",
          "<p>Regression testing was the most ambitious workflow. Using the Playwright toolset, an agent received three inputs — issue context describing expected behavior, PR metadata describing what changed, and access to browser automation against a staging environment — and generated end-to-end test specs covering the affected flows. Generated tests were reviewed like any other code before entering the suite, and the workflow could execute existing regression packs as a release-validation gate. Browser automation by an LLM is powerful precisely because it fails loudly: a selector that no longer matches or a flow that behaves unexpectedly produces evidence, not silent passes. The discipline was treating generated specs as drafts requiring human approval — automation of test authoring, never abdication of test judgment.</p>",
          "<p>In parallel, I built standalone AI agents with LangChain, in both high-code and low-code flavors. The high-code path gave us typed tools, composable prompt chains, tool-calling flows with retries and validation, and retrieval pipelines over internal documentation so answers were grounded in our actual systems rather than the model's priors. The low-code path let teammates assemble the same primitives visually and iterate on prompts without deployments. The trade-offs were instructive: low-code maximizes iteration speed and accessibility; high-code gives you testability, version control, and evaluation harnesses. Enterprise automation needs both — prototypes in low-code, production in high-code.</p>",
          "<p>Wiring it together was classical DevOps wearing a new hat. Every workflow hung off PR triggers with concurrency groups so pushes canceled stale runs. Token budgets and timeouts capped cost per execution. Logs, prompts, and tool calls were fully traceable per run, and we treated prompt changes exactly like code changes — reviewed, diffed, and tested against known-bad inputs. None of that is glamorous, but it's the difference between a demo and infrastructure.</p>",
          "<p>A question that came up constantly was engine choice: Copilot, Claude, or Codex? We deliberately kept the engine as configuration rather than hardcoding it, because the answer turned out to be task-dependent. Long-context models handled sprawling diffs better, holding the whole change plus linked issues in view; faster models were ideal for narrow jobs like description summarization where latency mattered more than depth. Prompt structure mattered more than model brand. Every workflow prompt followed the same skeleton — role, scope, explicit output contract, and constraints — and we iterated against a small corpus of past pull requests as an informal evaluation set. If a prompt tweak improved one workflow but degraded another, that showed up immediately instead of lurking until production. Treating prompts as tested artifacts, not incantations, was probably the single highest-leverage habit we built.</p>",
          "<p>The agents also failed in instructive ways, and we learned to design for their failure modes. Early reviewers occasionally invented file paths or referenced code that didn't exist — classic hallucination — so we required every finding to cite concrete files and line ranges pulled through tool calls rather than from the model's memory. Over-eager agents produced comment spam; we tuned severity thresholds, deduplicated repeated findings across runs, and capped comments per PR so signal survived the noise. Silent partial failures were the worst offender: a workflow that 'succeeds' while skipping its actual job erodes trust fast, so steps validated their own outputs and failed loudly with actionable logs when something looked wrong. Each incident became a permanent evaluation case, replayed against future prompt changes. That feedback loop — incidents becoming tests — is what slowly turned clever demos into boring, dependable automation.</p>",
          "<p>If there's a takeaway from six months of teaching CI to think, it's this: agents amplify process quality in both directions. With clear contracts, scoped permissions, and safe outputs, they compress hours of mechanical judgment into minutes and make standards enforcement ambient. Without those things, they compress chaos too. Start with one narrow workflow, measure it like production software, keep the guardrails boring — and let the interesting part be what your team builds once the busywork runs itself.</p>"
        ]

          "<p>One of the most intense solo projects I've built was a CLI movie ticket booking system in C++. The goal wasn't just to build something fun — it was to deeply understand OOP principles in a systems language. I implemented the three pillars of OOP: encapsulation through private member access and public interfaces for movie, hall, and ticket classes; inheritance with a base Booking class and specialized subclasses for VIP, Regular, and Premium tiers; and abstraction where each component exposes only the necessary methods while hiding internal state.</p>",

          "<p>Beyond the CLI project, I've built a real-time sensor dashboard using MQTT and WebSockets for IoT data streaming, a personal task automation tool using GitHub Actions templates, and a silly but fun tool that analyzes my reading and music habits to generate personalized recommendations using basic clustering. The stack matters less than shipping — I default to Next.js for web frontends, Express or FastAPI for APIs, and SQLite or MongoDB when I actually need persistence. But sometimes the best learning happens in a single .cpp file with no frameworks at all.</p>",
          "<p>If you're a developer who hasn't started a side project yet, I'd encourage you to. The skills you develop — self-direction, rapid prototyping, and the courage to ship imperfect work — translate directly to your professional life in ways you wouldn't expect. And even if the project never goes anywhere, the technical muscles you flex along the way will serve you when the next enterprise challenge comes knocking.</p>"

          "<p>Let me set the record straight: legacy technologies aren't dead. In fact, they power a massive portion of the web that most modern framework evangelists forget exists. My early development work with PHP through a beginner project — a Rock Paper Scissors game with login functionality — taught me things that no React tutorial ever could.</p>",
          "<p>The Rock-Paper-Scissors-PHP project on my GitHub was my first foray into PHP, and it was surprisingly formative. I built a game where users set a password, log in with a custom username, and play against the computer. The computer's move was generated using PHP's built-in rand() function, while passwords were hashed using md5() — I deliberately chose md5 over password_hash to understand the algorithm and practice decryption techniques. The project followed a basic Model-View-Control (MVC) pattern to keep the code organized, and it ran on a simple PHP server with HTML and CSS for the frontend.</p>",

    const categories = ['Deloitte', 'Personal Projects', 'Research'];

    function renderBlogList() {
      const container = document.getElementById('blog-list');
      container.innerHTML = '';
      let delayIndex = 0;
      categories.forEach(category => {
        const grouped = posts
          .map((post, index) => ({ post, index }))
          .filter(item => item.post.category === category);
        if (!grouped.length) return;

        const section = document.createElement('div');
        section.className = 'blog-section';

        const heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.textContent = category;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'post-grid';

        grouped.forEach(({ post, index }) => {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.style.animationDelay = (delayIndex * 0.1) + 's';
          card.onclick = () => showPost(index);
          card.innerHTML = `
            <h3 class="card-title">${post.title}</h3>
            <p class="card-date">${post.date}</p>
            <p class="card-excerpt">${post.excerpt}</p>
          `;
          grid.appendChild(card);
          delayIndex++;
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function showPost(index) {
      const post = posts[index];
      document.getElementById('blog-list').style.display = 'none';
      const postView = document.getElementById('post-view');
      postView.style.display = 'block';

      document.getElementById('post-banner').src = post.banner;
      document.getElementById('post-banner').alt = post.title;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-date').textContent = post.date;

      const content = document.getElementById('post-content');
      content.innerHTML = '';
      post.paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'post-paragraph';
        div.innerHTML = p;
        content.appendChild(div);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showBlogList() {
      document.getElementById('post-view').style.display = 'none';
      document.getElementById('blog-list').style.removeProperty('display');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    var themeSelect = document.getElementById('themeSelect');
    var footer = document.querySelector('footer');
    var menuIcon = document.getElementById('menuIcon');
    var header = document.querySelector('header');
    var blogContainer = document.getElementById('blog-container');
    var root = document.querySelector(":root");
    var menu = document.getElementById("menu");
    var selectedTheme = document.getElementById("selectedTheme");
    var white = document.getElementById("whiteTheme");
    var dark = document.getElementById("darkTheme");
    var color = document.getElementById("colorTheme");

    if(window.innerWidth <= 720){
      themeSelect.addEventListener('click', () => {
        menu.style.position = "relative";
        menu.style.opacity = "1";
        menu.style.visibility = "visible";
      });

      blogContainer.addEventListener('click', () => {
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
      });

      menuIcon.addEventListener('click', () => {
        menuIcon.style.display = "none";
        header.style.display = "block";
        blogContainer.style.display = "none";
        footer.style.height = "10vh";
        footer.style.bottom = "1%";
        themeSelect.style.display = "none";
      });

      footer.addEventListener('click', () => {
        menuIcon.style.display = "block";
        footer.style.height = "18vh";
        footer.style.bottom = "4%";
        header.style.display = "none";
        blogContainer.style.display = "block";
        menu.style.position = "absolute";
        menu.style.opacity = "0";
        menu.style.visibility = "hidden";
        themeSelect.style.display = "block";
      });
    }

    function darkTheme(){
      menu.replaceChild(replace(), dark);
      selectedTheme.insertBefore(dark, selectedTheme.children[0]);
      let darkObj = new DarkTheme;
      document.querySelector('body').style.color = darkObj.border;
      root.style.setProperty('--borderColor', darkObj.border);
      root.style.setProperty('--backgroundColor', darkObj.bg);
      root.style.setProperty('--shadowColor', darkObj.shadow);
      root.style.setProperty('--contentColor', darkObj.content);
    }

    function colorTheme(){
      menu.replaceChild(replace(), color);
      selectedTheme.insertBefore(color, selectedTheme.children[0]);
      let colorObj = new ColorTheme;
      document.querySelector('body').style.color = colorObj.border;
      root.style.setProperty('--borderColor', colorObj.border);
      root.style.setProperty('--backgroundColor', colorObj.bg);
      root.style.setProperty('--shadowColor', colorObj.shadow);
      root.style.setProperty('--contentColor', colorObj.content);
    }

    function lightTheme(){
      menu.replaceChild(replace(), white);
      selectedTheme.insertBefore(white, selectedTheme.children[0]);
      let whiteObj = new WhiteTheme;
      document.querySelector('body').style.color = whiteObj.border;
      root.style.setProperty('--borderColor', whiteObj.border);
      root.style.setProperty('--backgroundColor', whiteObj.bg);
      root.style.setProperty('--shadowColor', whiteObj.shadow);
      root.style.setProperty('--contentColor', whiteObj.content);
    }

    function replace(){
      var insideTheme = null;
      for(var i = 0; i < selectedTheme.childNodes.length; i++){
        if(selectedTheme.childNodes[i].className == "menuItem"){
          insideTheme = selectedTheme.childNodes[i];
          break;
        }
      }
      return insideTheme;
    };

    renderBlogList();
  </script>
</body>
